ou build your own eval set for a real product?", "q_zh": "怎么为一个真实产品建自己的 eval set？", "answer_en": "<ul><li>Start from real data: collect real user queries and failure cases, not made-up ones.</li><li>Cover both typical cases and edge cases (hard examples, common mistakes, safety lines).</li><li>Write a clear rubric that defines what counts as good or bad.</li><li>Keep it versioned and protect it from contamination — do not leak it into prompts or training data.</li><li>Use a mix: automatic metrics (including LLM-as-judge) for full-set regression, plus human spot-checks to calibrate.</li></ul>", "answer_zh": "<ul><li>从真实数据出发：收集真实 query 和失败案例，别凭空编。</li><li>同时覆盖典型场景和边界场景（难例、易错例、安全红线）。</li><li>写清楚 rubric，定义什么算好、什么算坏。</li><li>eval set 要版本化、防污染——别泄进 prompt 示例或训练数据。</li><li>混合评估：自动指标（含 LLM-as-judge）跑全量做回归，人评抽样校准。</li></ul>", "followup": "<ul><li>追问&quot;eval set 多大合适？&quot; → 没有绝对数；先几十到上百条能跑起来、能区分版本好坏即可，再按需扩充，关键是有代表性而非单纯堆量。</li></ul>", "pitfall": "<ul><li>直接拿公开 benchmark 当验收标准；榜单高分不等于你具体业务好用，自建 eval 才贴合真实场景。</li></ul>"}, {"id": "topics/llm/12-hallucination-alignment.md#q1", "topic": "幻觉与对齐", "domain": "llm", "file": "topics/llm/12-hallucination-alignment.md", "status": "drafted", "difficulty": "基础", "q_en": "What is hallucination in LLMs?", "q_zh": "什么是 LLM 的 hallucination（幻觉）？", "answer_en": "<ul><li>Hallucination is when the model confidently makes up content that is not true.</li><li>The output sounds fluent and sure, but the facts are wrong or invented (fake papers, fake APIs, wrong dates).</li><li>The danger is that it looks correct, so users may not notice.</li></ul>", "answer_zh": "<ul><li>hallucination 就是模型<strong>很自信地编造不真实的内容</strong>。</li><li>输出很流畅、语气笃定，但事实是错的或虚构的（假论文、假 API、错日期）。</li><li>危险在于它<strong>看起来像对的</strong>，用户不容易察觉。</li></ul>", "followup": "<ul><li>追问&quot;答错和幻觉有区别吗？&quot; → 有：幻觉强调&quot;<strong>自信地编造、看起来可信</strong>&quot;；不是简单的算错或笔误。</li></ul>", "pitfall": "<ul><li>以为幻觉只在小模型里出现；其实再强的大模型也会幻觉，只是频率不同。</li><li>以为输出流畅就代表正确；流畅和真实是两回事。</li></ul>"}, {"id": "topics/llm/12-hallucination-alignment.md#q2", "topic": "幻觉与对齐", "domain": "llm", "file": "topics/llm/12-hallucination-alignment.md", "status": "drafted", "difficulty": "进阶", "q_en": "Why do LLMs hallucinate?", "q_zh": "LLM 为什么会产生幻觉？", "answer_en": "<ul><li>The training goal is to predict the next token, not to tell the truth. Fluent text can still be false.</li><li>The model has limited knowledge; for facts it never really learned, it fills the gap with a plausible-looking guess.</li><li>It over-generalizes patterns, so it produces something that fits the style but does not exist.</li><li>By default it has no built-in way to say &quot;I don&#x27;t know.&quot;</li></ul>", "answer_zh": "<ul><li>训练目标是<strong>预测下一个 token，不是求真</strong>，流畅的句子也可能是假的。</li><li>知识有边界：没真正学过的事实，它会<strong>用看似合理的猜测去补全</strong>。</li><li>它会<strong>过度泛化模式</strong>，造出符合风格但不存在的内容。</li><li>默认没有&quot;我不知道&quot;的机制，倾向于总给个答案。</li></ul>", "followup": "<ul><li>追问&quot;那加大模型能解决吗？&quot; → 能降低，但不能根治；知识缺失和&quot;预测 token&quot;的本质还在，工程上常配 RAG。</li></ul>", "pitfall": "<ul><li>以为幻觉是 bug、能靠改代码修掉；它更像是当前训练范式的<strong>固有副作用</strong>。</li></ul>"}, {"id": "topics/llm/12-hallucination-alignment.md#q3", "topic": "幻觉与对齐", "domain": "llm", "file": "topics/llm/12-hallucination-alignment.md", "status": "drafted", "difficulty": "进阶", "q_en": "How do you reduce hallucination in a real system?", "q_zh": "在真实系统里怎么减少幻觉？", "answer_en": "<ul><li>Use RAG / grounding: retrieve real documents and let the model answer based on them, not from memory.</li><li>Ask the model to cite sources, so answers can be checked.</li><li>Train or prompt the model to say &quot;I don&#x27;t know&quot; when evidence is weak.</li><li>Lower temperature for more conservative output, and use eval to measure the hallucination rate.</li></ul>", "answer_zh": "<ul><li>用 <strong>RAG / grounding</strong>：检索真实材料，让模型<strong>基于给定材料</strong>回答，而不是凭记忆。</li><li>让模型<strong>引用来源</strong>，方便核对。</li><li>训练或用 prompt 让模型在证据不足时<strong>说&quot;不知道&quot;</strong>。</li><li>降低 temperature 让输出更保守；用 <strong>eval</strong> 度量幻觉率以持续改进。</li></ul>", "followup": "<ul><li>追问&quot;RAG 能彻底消除幻觉吗？&quot; → 不能：检索到错的/无关的材料，或模型不遵守材料，照样会幻觉；RAG 是大幅缓解，不是消除。</li></ul>", "pitfall": "<ul><li>以为接了 RAG 就万事大吉；检索质量差、模型不&quot;听话&quot;时仍会编。</li></ul>"}, {"id": "topics/llm/12-hallucination-alignment.md#q4", "topic": "幻觉与对齐", "domain": "llm", "file": "topics/llm/12-hallucination-alignment.md", "status": "drafted", "difficulty": "进阶", "q_en": "What is alignment, and why does it matter?", "q_zh": "什么是 alignment（对齐）？为什么重要？", "answer_en": "<ul><li>Alignment means making the model&#x27;s behavior match human intent and values.</li><li>A strong but unaligned model could be very capable yet also do harmful things or ignore what you asked.</li><li>It matters because raw capability is not enough — we need the model to do what we want and avoid what we don&#x27;t.</li></ul>", "answer_zh": "<ul><li>alignment 就是让模型行为<strong>符合人类的意图和价值观</strong>。</li><li>一个<strong>强但没对齐</strong>的模型可能很能干，却也会做有害的事、或答非所问。</li><li>重要性在于：光有能力不够，还要模型<strong>按你的意思来、并避开不该做的</strong>。</li></ul>", "followup": "<ul><li>追问&quot;对齐和能力是一回事吗？&quot; → 不是：能力是&quot;会不会&quot;，对齐是&quot;该不该、按不按你意思来&quot;，两者可以分开。</li></ul>", "pitfall": "<ul><li>把对齐窄化成&quot;不说脏话/不输出有害内容&quot;；它也包括遵从意图、诚实等更广的目标。</li></ul>"}, {"id": "topics/llm/12-hallucination-alignment.md#q5", "topic": "幻觉与对齐", "domain": "llm", "file": "topics/llm/12-hallucination-alignment.md", "status": "drafted", "difficulty": "高阶", "q_en": "What is RLHF? Explain the steps.", "q_zh": "什么是 RLHF？讲讲它的步骤。", "answer_en": "<ul><li>RLHF means Reinforcement Learning from Human Feedback. It is a common way to align models.</li><li>Step 1: supervised fine-tuning (SFT) on human demonstrations, so the model learns to follow instructions.</li><li>Step 2: humans rank several model answers; we train a reward model to predict these preferences.</li><li>Step 3: use reinforcement learning (e.g. PPO) to push the model toward answers the reward model scores higher.</li></ul>", "answer_zh": "<ul><li>RLHF = 从人类反馈中强化学习，是常见的对齐方法。</li><li>第一步：用人工示范做<strong>监督微调（SFT）</strong>，让模型学会按指令回答。</li><li>第二步：人对多个回答<strong>排序</strong>，训练一个<strong>奖励模型（reward model）</strong>预测人类偏好。</li><li>第三步：用强化学习（如 PPO）让模型<strong>朝奖励模型打分更高的回答</strong>优化。</li></ul>", "followup": "<ul><li>追问&quot;RLHF 有什么缺点？&quot; → 依赖大量人工标注、成本高；奖励模型可能被&quot;钻空子&quot;（reward hacking）；人类偏好本身有噪声和偏差。</li></ul>", "pitfall": "<ul><li>以为 RLHF 给模型注入了新知识；它主要调的是<strong>行为/风格/偏好</strong>，不是教新事实。</li><li>把奖励模型当成最终模型；它只是个<strong>打分器</strong>，用来训练真正的策略模型。</li></ul>"}, {"id": "topics/llm/12-hallucination-alignment.md#q6", "topic": "幻觉与对齐", "domain": "llm", "file": "topics/llm/12-hallucination-alignment.md", "status": "drafted", "difficulty": "高阶", "q_en": "What is Constitutional AI, and what is the HHH framework?", "q_zh": "什么是 Constitutional AI？什么是 HHH 框架？", "answer_en": "<ul><li>Constitutional AI uses a set of written principles (a &quot;constitution&quot;) to let the model critique and revise its own answers. ⚠️待核实</li><li>This reduces the need for humans to label harmful examples, using AI feedback in place of some human feedback.</li><li>HHH stands for Helpful, Harmless, Honest — a common set of alignment goals.</li><li>These three can conflict: the most helpful answer may not be the safest, so alignment is partly about the trade-off.</li></ul>", "answer_zh": "<ul><li>Constitutional AI 用一套写明的<strong>原则（&quot;宪法&quot;）</strong>，让模型<strong>自己批评并修改</strong>自己的回答。⚠️待核实</li><li>好处是<strong>减少对人工标注有害样本的依赖</strong>，用 AI 反馈部分替代人类反馈。</li><li>HHH = <strong>Helpful（有用）/ Harmless（无害）/ Honest（诚实）</strong>，是常被引用的一组对齐目标。</li><li>三者会<strong>冲突</strong>：最有用的答案未必最安全，所以对齐很大程度是在做权衡。</li></ul>", "followup": "<ul><li>追问&quot;hallucination 属于 HHH 哪一项？&quot; → 主要属于 <strong>Honest</strong>：编内容就是不诚实，所以减少幻觉是对齐目标之一。</li></ul>", "pitfall": "<ul><li>以为 HHH 三者总能同时满足；实际常要在有用 vs 无害、有用 vs 诚实之间取舍。</li><li>把 Constitutional AI 当成&quot;完全不用人类&quot;；它仍需要人来写原则、并配合其他训练。⚠️待核实</li></ul>"}, {"id": "topics/llm/13-multimodal.md#q1", "topic": "多模态", "domain": "llm", "file": "topics/llm/13-multimodal.md", "status": "drafted", "difficulty": "基础", "q_en": "What is a multimodal model?", "q_zh": "什么是多模态模型？", "answer_en": "<ul><li>A multimodal model can take more than one type of input, such as text plus images (or audio, video).</li><li>The most common case is vision + language: you give an image and ask a question in text, and it answers in text.</li><li>The key idea is to turn non-text inputs into token-like embeddings the model can process.</li></ul>", "answer_zh": "<ul><li>多模态模型能接收不止一种输入，比如文本 + 图像（或音频、视频）。</li><li>最常见是&quot;视觉 + 语言&quot;：给一张图、用文字提问，它用文字回答。</li><li>核心思想：把非文本输入也变成类似 token 的 embedding，让模型能处理。</li></ul>", "followup": "<ul><li>追问&quot;和普通 LLM 差别在哪？&quot; → 普通 LLM 只吃文本 token；多模态模型多了一条&quot;把图像 / 音频变成 embedding&quot;的输入通路，再和文本一起处理。</li></ul>", "pitfall": "<ul><li>以为多模态 = 模型自己长了眼睛；实际是靠一个 vision encoder 把图像编码成向量再喂进去。</li></ul>"}, {"id": "topics/llm/13-multimodal.md#q2", "topic": "多模态", "domain": "llm", "file": "topics/llm/13-multimodal.md", "status": "drafted", "difficulty": "基础", "q_en": "How does an image get into a language model?", "q_zh": "图像是怎么进入语言模型的？", "answer_en": "<ul><li>The image is split into small patches (e.g. 16×16 pixels each).</li><li>A vision encoder like ViT turns these patches into a sequence of vectors, like &quot;image tokens&quot;.</li><li>A projector maps these vectors into the LLM&#x27;s input space, so they can sit next to text tokens.</li></ul>", "answer_zh": "<ul><li>图像先被切成一个个小 patch（如 16×16 像素）。</li><li>用 ViT 这类 vision encoder 把 patch 变成一串向量，相当于&quot;图像 token&quot;。</li><li>再用 projector 把这些向量映射到 LLM 的输入空间，和文本 token 拼在一起。</li></ul>", "followup": "<ul><li>追问&quot;为什么要切 patch？&quot; → Transformer 处理的是序列，patch 化把二维图像变成一串&quot;视觉 token&quot;，就能套用 Transformer。</li><li>追问&quot;ViT 是什么？&quot; → Vision Transformer，把图像当成 patch 序列跑 Transformer 的视觉模型。</li></ul>", "pitfall": "<ul><li>以为图像像素直接喂进 LLM；中间必须经过 vision encoder + projector 两步转换。</li></ul>"}, {"id": "topics/llm/13-multimodal.md#q3", "topic": "多模态", "domain": "llm", "file": "topics/llm/13-multimodal.md", "status": "drafted", "difficulty": "进阶", "q_en": "What is CLIP and what is its core idea?", "q_zh": "CLIP 是什么？核心思想是什么？", "answer_en": "<ul><li>CLIP maps images and text into the same vector space using contrastive learning.</li><li>It has two encoders: one for images, one for text, trained on many image–caption pairs.</li><li>Matching image–text pairs are pulled close; non-matching pairs are pushed apart.</li><li>After training you can compare an image and text by similarity — good for retrieval and zero-shot classification.</li></ul>", "answer_zh": "<ul><li>CLIP 用对比学习把图像和文本映射到<strong>同一个向量空间</strong>。</li><li>有两个编码器：image encoder 和 text encoder，用海量&quot;图 + 配文&quot;对训练。</li><li>正确配对的图文拉近，错误配对推远。</li><li>训完后可直接比图文相似度 → 适合图文检索、zero-shot 分类。</li></ul>", "followup": "<ul><li>追问&quot;什么是 zero-shot 分类？&quot; → 给一张图和几个文字标签，分别编码后比相似度，最近的就是预测类别，不用为新类别重新训练。</li><li>追问&quot;CLIP 能直接生成回答吗？&quot; → 不能，CLIP 只做映射 / 比相似度；要生成文字得接 LLM（VLM 常拿 CLIP 当视觉骨干）。</li></ul>", "pitfall": "<ul><li>以为 CLIP 是个聊天 / 生成模型；它是个&quot;图文对齐 + 检索&quot;模型，不生成文本。</li><li>把对比学习理解成分类训练；它学的是&quot;配对相不相似&quot;，不是固定类别。</li></ul>"}, {"id": "topics/llm/13-multimodal.md#q4", "topic": "多模态", "domain": "llm", "file": "topics/llm/13-multimodal.md", "status": "drafted", "difficulty": "进阶", "q_en": "What does a typical VLM architecture look like?", "q_zh": "典型的 VLM 架构长什么样？", "answer_en": "<ul><li>A typical VLM has three parts: an image encoder, a projector, and an LLM.</li><li>The image encoder (often CLIP/ViT-based) turns the image into visual vectors.</li><li>The projector aligns those vectors to the LLM&#x27;s input space.</li><li>The LLM takes image tokens plus text tokens together and generates the text answer.</li></ul>", "answer_zh": "<ul><li>典型 VLM 三部分：image encoder + projector + LLM。</li><li>image encoder（常基于 CLIP / ViT）把图像变成视觉向量。</li><li>projector 把视觉向量对齐到 LLM 的输入空间。</li><li>LLM 把&quot;图像 token + 文本 token&quot;一起当输入，生成文字回答。</li></ul>", "followup": "<ul><li>追问&quot;训练时主要训哪块？&quot; → 常见做法是冻结已训好的 image encoder 和 LLM，主要训中间 projector，成本低、复用已有能力（具体策略因模型而异 ⚠️待核实）。</li><li>追问&quot;projector 起什么作用？&quot; → 把视觉向量的维度和语义对齐到 LLM 能直接吃的空间，否则图像信息进不去 LLM。</li></ul>", "pitfall": "<ul><li>以为 VLM 是从零重训一个大模型；多数是把现成的 vision encoder 和 LLM 用 projector 接起来。</li></ul>"}, {"id": "topics/llm/13-multimodal.md#q5", "topic": "多模态", "domain": "llm", "file": "topics/llm/13-multimodal.md", "status": "drafted", "difficulty": "高阶", "q_en": "What are the main limitations of current VLMs?", "q_zh": "当前 VLM 的主要局限是什么？", "answer_en": "<ul><li>Hallucination: the model may describe objects or details that are not in the image.</li><li>Fine-grained tasks are weak: counting, exact spatial relations, and small objects often fail.</li><li>Resolution limits: after patching, fine details can be lost, so dense text or complex charts are hard.</li><li>Alignment quality: if the projector aligns poorly, visual info does not reach the LLM well.</li></ul>", "answer_zh": "<ul><li>幻觉：会描述图里其实没有的物体或细节。</li><li>细粒度任务弱：数数、精确空间关系、小物体常出错。</li><li>分辨率限制：patch 化后细节易丢，密集文字 / 复杂图表难读对。</li><li>对齐质量：projector 对齐不好，视觉信息进不去 LLM，回答和图脱节。</li></ul>", "followup": "<ul><li>追问&quot;为什么会幻觉？&quot; → 一部分来自 LLM 本身的语言先验：它会&quot;按常识补全&quot;图里没明说的东西，而非严格基于像素证据。</li><li>追问&quot;怎么缓解分辨率问题？&quot; → 思路如提高输入分辨率、切多个子图 / tiles 分别编码等（具体方案因模型而异 ⚠️待核实）。</li></ul>", "pitfall": "<ul><li>以为 VLM 能像专用 OCR 一样精确读字；通用 VLM 的 OCR 能力有限，密集 / 小字仍易错。</li></ul>"}, {"id": "topics/systems/01-serving-inference.md#q1", "topic": "推理服务与部署", "domain": "systems", "file": "topics/systems/01-serving-inference.md", "status": "drafted", "difficulty": "基础", "q_en": "What does it mean to \"serve\" an LLM, and how is inference different from training?", "q_zh": "什么叫\"serve\"一个 LLM？推理和训练有什么不同？", "answer_en": "<ul><li>Serving means wrapping a trained model as a live service (usually an API) that handles many requests.</li><li>Training runs once; inference runs every time a user sends a prompt.</li><li>For serving we care about two things: low latency (fast response) and high throughput (more tokens per GPU, which drives cost).</li></ul>", "answer_zh": "<ul><li>serving 就是把训练好的模型包成一个常驻服务（通常是 API），处理大量请求。</li><li>训练只做一次；inference 是每来一个请求就跑一次。</li><li>serving 关心两件事：低 latency（响应快）和高 throughput（每张卡出更多 token，决定成本）。</li></ul>", "followup": "<ul><li>追问&quot;latency 和 throughput 为什么会冲突？&quot; → 加大 batch 能提吞吐，但请求要凑批、排队，单个请求的延迟可能变高；serving 就是在二者间权衡。</li></ul>", "pitfall": "<ul><li>把 serving 当成&quot;再训练一遍&quot;；serving 不更新权重，只做前向推理。</li></ul>"}, {"id": "topics/systems/01-serving-inference.md#q2", "topic": "推理服务与部署", "domain": "systems", "file": "topics/systems/01-serving-inference.md", "status": "drafted", "difficulty": "进阶", "q_en": "What are the prefill and decode phases in LLM inference, and why do they behave differently?", "q_zh": "LLM 推理里的 prefill 和 decode 是什么？为什么计算特性不同？", "answer_en": "<ul><li>Prefill: the whole prompt is processed in parallel in one pass; it is compute-bound and uses the GPU well.</li><li>Decode: tokens are generated one at a time, each step reads all past KV cache; it is memory-bandwidth-bound.</li><li>So prefill is heavy on compute, while decode is limited by memory bandwidth, not raw compute.</li></ul>", "answer_zh": "<ul><li>prefill：整段 prompt 一次并行处理；计算密集（compute-bound），能吃满 GPU 算力。</li><li>decode：一次生成一个 token，每步都要读全部历史 KV cache；访存密集（memory-bandwidth-bound）。</li><li>所以 prefill 吃算力，decode 卡在显存带宽上，而不是算力。</li></ul>", "followup": "<ul><li>追问&quot;为什么 decode 算力吃不满？&quot; → 每步只算 1 个新 token 的运算量很小，但要搬运大量 KV cache，瓶颈在带宽不在算力。</li><li>追问&quot;这对优化有什么启示？&quot; → decode 是逐字生成的主战场，所以 batching、KV cache 管理主要在优化 decode。</li></ul>", "pitfall": "<ul><li>以为 prefill 和 decode 用的是不同模型；是同一个模型的两个阶段。</li><li>以为生成慢是因为算力不够；decode 慢主要是访存瓶颈。</li></ul>"}, {"id": "topics/systems/01-serving-inference.md#q3", "topic": "推理服务与部署", "domain": "systems", "file": "topics/systems/01-serving-inference.md", "status": "drafted", "difficulty": "进阶", "q_en": "What is the KV cache and why is it important for inference?", "q_zh": "什么是 KV cache？为什么它对推理很重要？", "answer_en": "<ul><li>In attention, each new token needs the Key and Value of all earlier tokens.</li><li>KV cache stores those Keys and Values so we don&#x27;t recompute them every step.</li><li>It makes decode much faster, but it takes GPU memory that grows with sequence length and batch size.</li></ul>", "answer_zh": "<ul><li>attention 里每个新 token 都要用到前面所有 token 的 Key 和 Value。</li><li>KV cache 把这些 K、V 存下来，避免每一步重算。</li><li>它让 decode 快很多，但占显存，且随序列长度和 batch 大小增长。</li></ul>", "followup": "<ul><li>追问&quot;KV cache 大到什么程度？&quot; → 长上下文 + 大 batch 时它常常比模型权重还吃显存，是 serving 的主要显存瓶颈。</li><li>追问&quot;怎么省 KV cache 显存？&quot; → 例如分页管理（PagedAttention）减少碎片、量化 KV、共享 KV（如 GQA/MQA）等思路。</li></ul>", "pitfall": "<ul><li>以为 KV cache 缓存的是输出文本；它缓存的是每个 token 的 Key / Value 向量。</li><li>以为它是训练时的优化；它主要省的是<strong>推理</strong>时的重复计算。</li></ul>"}, {"id": "topics/systems/01-serving-inference.md#q4", "topic": "推理服务与部署", "domain": "systems", "file": "topics/systems/01-serving-inference.md", "status": "drafted", "difficulty": "进阶", "q_en": "Compare static, dynamic, and continuous batching. Why does continuous batching boost throughput?", "q_zh": "对比 static、dynamic、continuous batching；为什么 continuous batching 能提吞吐？", "answer_en": "<ul><li>Static batching waits for a fixed batch, then runs it all together — short requests must wait for long ones.</li><li>Dynamic batching groups requests in a short time window, but once started the batch still finishes together.</li><li>Continuous batching schedules per step: finished requests leave immediately and new ones join, so the GPU stays full each step — that is why throughput goes up.</li></ul>", "answer_zh": "<ul><li>static batching：凑满固定批再一起跑，短请求要等长请求，GPU 空转。</li><li>dynamic batching：短时间窗口内凑批，但开跑后整批还是一起结束，仍有浪费。</li><li>continuous batching：以&quot;步&quot;为粒度调度，生成完的请求立刻走、新请求随时插进来，每步都尽量塞满 GPU → 所以吞吐显著提升。</li></ul>", "followup": "<ul><li>追问&quot;continuous batching 还有别的好名字吗？&quot; → 也叫 in-flight batching，强调请求在飞行中被动态加入/移出 batch。</li><li>追问&quot;它会牺牲什么？&quot; → 调度更复杂，且需要灵活的 KV cache 显存管理来支持请求随时进出。</li></ul>", "pitfall": "<ul><li>把 continuous batching 当成&quot;batch 更大&quot;；关键不是更大，而是<strong>调度粒度更细</strong>、不让完成的请求拖住整批。</li></ul>"}, {"id": "topics/systems/01-serving-inference.md#q5", "topic": "推理服务与部署", "domain": "systems", "file": "topics/systems/01-serving-inference.md", "status": "drafted", "difficulty": "进阶", "q_en": "What roles do vLLM, TGI, and TensorRT-LLM play in serving?", "q_zh": "vLLM、TGI、TensorRT-LLM 在推理服务里各扮演什么角色？", "answer_en": "<ul><li>They are inference engines that handle batching, KV cache management, and optimized GPU kernels for you.</li><li>vLLM: open-source, known for PagedAttention and continuous batching, focused on high throughput.</li><li>TGI: Hugging Face&#x27;s serving framework, easy to deploy HF models. TensorRT-LLM: NVIDIA&#x27;s library that compiles models into highly optimized GPU kernels.</li><li>(Exact versions and newest features should be checked against official docs.)</li></ul>", "answer_zh": "<ul><li>它们都是推理引擎，替你封装 batching、KV cache 管理、优化 GPU kernel。</li><li>vLLM：开源，以 PagedAttention（分页管理 KV cache 显存）和 continuous batching 著称，主打高吞吐。</li><li>TGI：Hugging Face 的 serving 框架，方便部署 HF 模型；TensorRT-LLM：NVIDIA 的库，把模型编译成高度优化的 GPU kernel。</li><li>（⚠️待核实：具体版本号与最新特性以官方为准，截至 2026-06。）</li></ul>", "followup": "<ul><li>追问&quot;怎么选？&quot; → 要极致性能且在 NVIDIA 卡上偏向 TensorRT-LLM；要开源、高吞吐、社区活跃偏向 vLLM；要快速部署 HF 模型可看 TGI。按性能 / 硬件绑定 / 易用性 / 生态权衡。</li></ul>", "pitfall": "<ul><li>把推理引擎当成模型本身；它们是&quot;跑模型的运行时&quot;，模型权重还是另外加载的。</li><li>背诵具体版本号或性能数字 → 这些变化快，面试宁可说&quot;按官方最新为准&quot;也别编（⚠️待核实）。</li></ul>"}, {"id": "topics/systems/01-serving-inference.md#q6", "topic": "推理服务与部署", "domain": "systems", "file": "topics/systems/01-serving-inference.md", "status": "drafted", "difficulty": "高阶", "q_en": "When do you need tensor or pipeline parallelism, and how do they differ?", "q_zh": "什么时候需要 tensor / pipeline parallelism？两者有什么区别？", "answer_en": "<ul><li>You need model parallelism when the model (weights plus KV cache) does not fit on a single GPU.</li><li>Tensor parallelism splits the big matrices inside a layer across GPUs; it talks a lot, so it is usually within one machine with fast links (e.g. NVLink).</li><li>Pipeline parallelism splits the model by layers across GPUs; it talks less and can span machines, but has pipeline bubbles (some GPUs idle at the start and end).</li></ul>", "answer_zh": "<ul><li>当模型（权重 + KV cache）单卡放不下时，才需要 model parallelism。</li><li>tensor parallelism：把单层内部的大矩阵切到多卡；通信频繁，通常用在单机内用高速互联（NVLink）的多卡。</li><li>pipeline parallelism：把模型按层切段分到多卡；通信少、可跨机，但有流水线气泡（首尾阶段部分卡空闲）。</li></ul>", "followup": "<ul><li>追问&quot;两者能一起用吗？&quot; → 能。常见先用 tensor parallelism 占满单机多卡，不够再叠 pipeline parallelism 跨机。</li><li>追问&quot;放得下还要拆吗？&quot; → 不要。并行有通信开销，单卡能装就别拆。</li></ul>", "pitfall": "<ul><li>把 model parallelism 和 data parallelism 混了：data parallelism 是每张卡放完整模型、分摊不同数据（训练常用）；model parallelism 是把一个模型拆到多卡（单卡装不下时用）。</li></ul>"}, {"id": "topics/systems/02-latency-throughput.md#q1", "topic": "延迟与吞吐优化", "domain": "systems", "file": "topics/systems/02-latency-throughput.md", "status": "drafted", "difficulty": "基础", "q_en": "What is the difference between latency and throughput in LLM serving?", "q_zh": "LLM 服务里 latency 和 throughput 有什么区别？", "answer_en": "<ul><li>Latency is how fast one request gets its result. It is about a single user&#x27;s experience.</li><li>Throughput is how many requests or tokens the system handles per unit time. It is about total capacity and cost.</li><li>They often trade off: bigger batches raise throughput but make each request wait longer, so latency goes up.</li></ul>", "answer_zh": "<ul><li>latency 是单个请求多快拿到结果，关心<strong>单个用户体验</strong>。</li><li>throughput 是单位时间能处理多少请求 / token，关心<strong>整体能力和成本</strong>。</li><li>二者常对立：batch 越大 throughput 越高，但单请求要等凑批，latency 变长。</li></ul>", "followup": "<ul><li>追问&quot;那到底优化哪个？&quot; → 看 SLA：交互类压 latency，离线批处理类拉 throughput；通常是&quot;先满足 latency 约束，再在约束内尽量提 throughput&quot;。</li></ul>", "pitfall": "<ul><li>以为两者能同时无脑拉满；它们多数时候是权衡关系。</li><li>把高 throughput 当成低 latency 的同义词，其实可能正相反。</li></ul>"}, {"id": "topics/systems/02-latency-throughput.md#q2", "topic": "延迟与吞吐优化", "domain": "systems", "file": "topics/systems/02-latency-throughput.md", "status": "drafted", "difficulty": "基础", "q_en": "What is TTFT and TPOT? How do they relate to total latency?", "q_zh": "什么是 TTFT 和 TPOT？它们和总延迟什么关系？", "answer_en": "<ul><li>TTFT (Time To First Token) is the time until the first token comes out. It is driven by the prefill step plus any queue / batching wait.</li><li>TPOT (Time Per Output Token), also called inter-token latency, is the average gap between later tokens, driven by the decode step.</li><li>Total latency is roughly TTFT + TPOT × number of output tokens.</li></ul>", "answer_zh": "<ul><li><strong>TTFT</strong> = 第一个 token 出来的时间，主要由 prefill 决定，还含排队 / 凑批等待。</li><li><strong>TPOT</strong>（即 inter-token latency）= 后续相邻 token 之间的平均间隔，由 decode 决定。</li><li>总延迟 ≈ <strong>TTFT + TPOT × 输出 token 数</strong>。</li></ul>", "followup": "<ul><li>追问&quot;流式输出为什么要看 TTFT？&quot; → 流式下用户看到第一个字就觉得&quot;开始响应了&quot;，TTFT 直接决定体感快慢，哪怕总时长一样。</li><li>追问&quot;为什么 prefill 和 decode 瓶颈不同？&quot; → prefill 一次算整个 prompt，是 compute-bound；decode 每步只算一个 token 但反复读 KV，是 memory-bound。</li></ul>", "pitfall": "<ul><li>只盯平均延迟，忽略 p95 / p99 尾延迟。</li><li>以为输出越长 TTFT 越大；TTFT 基本只跟输入长度 + 等待有关，输出长度影响的是总延迟里的 TPOT 部分。</li></ul>"}, {"id": "topics/systems/02-latency-throughput.md#q3", "topic": "延迟与吞吐优化", "domain": "systems", "file": "topics/systems/02-latency-throughput.md", "status": "drafted", "difficulty": "进阶", "q_en": "How do batching and KV cache improve serving, and what do they cost?", "q_zh": "batching 和 KV cache 怎么提升服务？代价是什么？", "answer_en": "<ul><li>Batching runs many requests together on the GPU, raising utilization and throughput. The cost is each request may wait to be batched, so latency can rise.</li><li>Continuous batching swaps finished requests out and new ones in on the fly, instead of waiting for a whole batch, so it wastes less.</li><li>KV cache stores the K and V of past tokens so each new token is not recomputed from scratch. The cost is large GPU memory that grows with context length and concurrency.</li></ul>", "answer_zh": "<ul><li><strong>batching</strong>：多个请求一起算，提升 GPU 利用率和 throughput；代价是单请求要等凑批，latency 可能上升。</li><li><strong>continuous batching</strong>：谁算完就换出、新请求随时插入，不必等整批，更省资源。</li><li><strong>KV cache</strong>：缓存历史 token 的 K、V，新 token 不必重算整个前缀；代价是<strong>占大量显存</strong>，随上下文长度和并发线性增长。</li></ul>", "followup": "<ul><li>追问&quot;KV cache 省的是哪部分计算？&quot; → 省的是 decode 阶段对前缀 K、V 的重复计算，是推理时优化，不改训练。</li><li>追问&quot;显存不够放 KV 怎么办？&quot; → 量化 KV、PagedAttention 减碎片、或限制最大上下文 / 并发。</li></ul>", "pitfall": "<ul><li>以为 batch 越大永远越好；batch 太大会拉高单请求 latency，也可能爆显存。</li><li>把 KV cache 当成省显存的手段；它是省<strong>计算</strong>的，反而<strong>额外吃显存</strong>。</li></ul>"}, {"id": "topics/systems/02-latency-throughput.md#q4", "topic": "延迟与吞吐优化", "domain": "systems", "file": "topics/systems/02-latency-throughput.md", "status": "drafted", "difficulty": "进阶", "q_en": "What is speculative decoding and why does it help?", "q_zh": "什么是 speculative decoding？为什么有用？", "answer_en": "<ul><li>A small, fast draft model first guesses several tokens ahead.</li><li>The big model then verifies all of them in one parallel pass: accepted guesses are kept, the first wrong one is corrected and generation continues from there.</li><li>Because the big model checks many tokens at once, the average cost per token drops, so TPOT goes down — and the final output distribution is unchanged.</li></ul>", "answer_zh": "<ul><li>小而快的<strong>草稿模型</strong>先一次猜出若干 token。</li><li>大模型<strong>一次并行校验</strong>这些 token：猜对的采纳，从第一个猜错处纠正并继续。</li><li>大模型一次能验证多个 token，平均每 token 开销下降，<strong>降低 TPOT</strong>；且<strong>不改变最终输出分布</strong>。</li></ul>", "followup": "<ul><li>追问&quot;收益靠什么？&quot; → 靠草稿模型的命中率：草稿越接近大模型、猜得越准，被采纳的 token 越多，加速越明显；猜得差则收益有限甚至倒亏。</li><li>追问&quot;会不会改变结果质量？&quot; → 校验机制保证等价于大模型自己解码（采纳/拒绝规则做了概率上的修正），所以<strong>质量不变</strong>，省的是时间。</li></ul>", "pitfall": "<ul><li>以为是&quot;用小模型替大模型回答&quot;，质量会降；其实大模型仍负责最终校验，质量不变。</li><li>以为一定提速；命中率低时几乎没收益。</li></ul>"}, {"id": "topics/systems/02-latency-throughput.md#q5", "topic": "延迟与吞吐优化", "domain": "systems", "file": "topics/systems/02-latency-throughput.md", "status": "drafted", "difficulty": "进阶", "q_en": "How does quantization help latency and memory, and what is the trade-off?", "q_zh": "quantization 怎么帮到延迟和显存？有什么权衡？", "answer_en": "<ul><li>Quantization stores weights (and sometimes activations) in lower precision, like int8 or int4, instead of FP16.</li><li>This uses less GPU memory and lowers memory bandwidth pressure, so the memory-bound decode step often gets faster, and you can fit a bigger model or a bigger batch on the same GPU.</li><li>The trade-off is accuracy loss: more aggressive quantization (int4 vs int8) carries more risk, so you must evaluate quality.</li></ul>", "answer_zh": "<ul><li>quantization 把权重（有时含激活）从 FP16 降到 int8 / int4。</li><li>显存更省、显存带宽压力更低，memory-bound 的 decode 常因此变快，同卡能放更大模型或更大 batch。</li><li>权衡是<strong>精度损失</strong>：量化越激进（int4 比 int8）风险越大，必须评测确认质量。</li></ul>", "followup": "<ul><li>追问&quot;为什么省显存还能变快？&quot; → decode 阶段瓶颈是从显存搬权重 / KV，数据更小搬得更快；不是因为算得少。</li><li>追问&quot;怎么尽量少掉精度？&quot; → 用更成熟的量化方案、对敏感层保留高精度、量化后跑评测对比；具体方案 ⚠️待核实（随工具版本演进）。</li></ul>", "pitfall": "<ul><li>以为量化一定明显提速；在 compute-bound 的 prefill 上提速可能不明显，主要利好 memory-bound 阶段。</li><li>以为精度无损；总有损失，关键是能不能控制在可接受范围。</li></ul>"}, {"id": "topics/systems/02-latency-throughput.md#q6", "topic": "延迟与吞吐优化", "domain": "systems", "file": "topics/systems/02-latency-throughput.md", "status": "drafted", "difficulty": "高阶", "q_en": "You are given an SLA. How do you tune the system for latency vs throughput?", "q_zh": "给定一个 SLA，你怎么在 latency 和 throughput 之间调？", "answer_en": "<ul><li>First nail down the SLA, e.g. &quot;p95 TTFT under 500 ms&quot;. Tail latency (p95 / p99) matters more than the average.</li><li>For interactive / chat: push TTFT and TPOT down — smaller or continuous batching, prefix caching for shared prompts, maybe quantization; stream the output.</li><li>For offline / batch: push throughput up — large batches and quantization to pack more requests, accepting higher per-request latency.</li><li>General rule: meet the latency constraint first, then maximize throughput / cut cost within that constraint, and keep watching p95 / p99.</li></ul>", "answer_zh": "<ul><li>先定 SLA（如 &quot;p95 TTFT &lt; 500ms&quot;），盯<strong>尾延迟 p95 / p99</strong>，别只看平均。</li><li><strong>交互 / 对话类</strong>：压 TTFT、TPOT → 小 batch 或 continuous batching、prefix caching 复用共享前缀、必要时量化；流式输出。</li><li><strong>离线 / 批处理类</strong>：拉 throughput → 大 batch + 量化塞更多请求，容忍较高单请求 latency。</li><li>通则：先满足 latency 约束，再在约束内尽量提 throughput / 降成本，持续监控尾延迟。</li></ul>", "followup": "<ul><li>追问&quot;长 system prompt 被反复用，怎么优化？&quot; → 上 prefix caching，把这段前缀 KV 算一次跨请求复用，直接砍 TTFT。</li><li>追问&quot;并发上来显存不够？&quot; → PagedAttention 减碎片把显存用满、量化 KV、限制最大上下文 / 并发，或加卡。</li></ul>", "pitfall": "<ul><li>上来就追求&quot;最优配置&quot;；其实只有匹配业务 SLA 的配置，没有放之四海皆准的最优。</li><li>只优化平均延迟，忽略尾延迟导致部分用户体验很差。</li></ul>"}, {"id": "topics/systems/03-vector-databases.md#q1", "topic": "向量数据库", "domain": "systems", "file": "topics/systems/03-vector-databases.md", "status": "drafted", "difficulty": "基础", "q_en": "What is a vector database and why do we need one?", "q_zh": "什么是向量数据库？为什么需要它？", "answer_en": "<ul><li>A vector database stores embeddings (high-dimensional vectors) and finds the most similar ones to a query vector.</li><li>We need it for semantic search: finding content by meaning, not exact keywords.</li><li>It is the engine behind the &quot;retrieval&quot; step in RAG.</li></ul>", "answer_zh": "<ul><li>向量数据库存 embedding（高维向量），并能找出和查询向量最相似的几个。</li><li>它支撑语义检索：按&quot;意思&quot;找内容，而不是精确关键词。</li><li>它是 RAG 里&quot;检索&quot;那一步的底层引擎。</li></ul>", "followup": "<ul><li>追问&quot;普通数据库不行吗？&quot; → 普通数据库擅长精确匹配和范围查询，不擅长&quot;高维空间里找最近邻&quot;；向量数据库专门为相似度检索优化。</li></ul>", "pitfall": "<ul><li>以为向量数据库自己会算 embedding；多数情况下 embedding 由外部模型算好再存进去（部分产品可内置向量化，属可选功能）。</li></ul>"}, {"id": "topics/systems/03-vector-databases.md#q2", "topic": "向量数据库", "domain": "systems", "file": "topics/systems/03-vector-databases.md", "status": "drafted", "difficulty": "基础", "q_en": "What similarity metrics are used, and how do you choose?", "q_zh": "相似度怎么衡量？怎么选度量？", "answer_en": "<ul><li>Common metrics: cosine similarity, dot product, and L2 (Euclidean) distance.</li><li>Cosine looks at the angle (direction only); L2 looks at straight-line distance.</li><li>If vectors are normalized, dot product and cosine give the same ranking.</li><li>Pick the metric that matches how the embedding model was trained.</li></ul>", "answer_zh": "<ul><li>常见三种：cosine similarity、dot product、L2（欧氏距离）。</li><li>cosine 看夹角（只看方向）；L2 看直线距离。</li><li>向量归一化后，dot product 和 cosine 的排序结果一致。</li><li>选哪个要和 embedding 模型训练时用的度量保持一致。</li></ul>", "followup": "<ul><li>追问&quot;文本检索一般用哪个？&quot; → 文本 embedding 多用 cosine，因为更关心语义方向、不关心向量长度。</li></ul>", "pitfall": "<ul><li>以为度量随便选都行；和训练时不一致会让&quot;相近&quot;的判断失真，检索质量下降。</li></ul>"}, {"id": "topics/systems/03-vector-databases.md#q3", "topic": "向量数据库", "domain": "systems", "file": "topics/systems/03-vector-databases.md", "status": "drafted", "difficulty": "基础", "q_en": "Why use approximate nearest neighbor (ANN) instead of exact search?", "q_zh": "为什么用 ANN（近似最近邻）而不是精确最近邻？", "answer_en": "<ul><li>Exact search compares the query to every vector — O(N) — which is too slow at large scale.</li><li>ANN trades a little accuracy for a big speedup, often orders of magnitude faster.</li><li>We measure how good it is with recall: how many of the true top-k it finds.</li></ul>", "answer_zh": "<ul><li>精确检索要和库里每个向量都比，O(N)，规模大时太慢。</li><li>ANN 牺牲一点准确率换大幅提速，常快几个数量级。</li><li>好坏用 recall 衡量：找回的结果里有多少是真正的 top-k。</li></ul>", "followup": "<ul><li>追问&quot;那 ANN 会漏掉真正最近的吗？&quot; → 会，它不保证；但绝大多数场景下结果够用，且可调参数提高 recall（代价是变慢或更费内存）。</li></ul>", "pitfall": "<ul><li>把&quot;近似&quot;理解成&quot;质量差&quot;；其实在合理调参下 recall 可以很高，近似只是不做 100% 保证。</li></ul>"}, {"id": "topics/systems/03-vector-databases.md#q4", "topic": "向量数据库", "domain": "systems", "file": "topics/systems/03-vector-databases.md", "status": "drafted", "difficulty": "进阶", "q_en": "Give the intuition behind HNSW, IVF, and PQ.", "q_zh": "直觉上讲讲 HNSW、IVF、PQ。", "answer_en": "<ul><li>HNSW: a multi-layer graph where similar vectors are neighbors; search &quot;navigates&quot; the graph toward the query. Fast and high recall, but uses a lot of memory.</li><li>IVF: cluster all vectors first, then only search the few clusters nearest the query. Skips most of the data.</li><li>PQ (product quantization): a compression trick — split a vector into parts and store cheap approximations, saving memory and speeding up distance math, at some accuracy cost.</li><li>IVF and PQ are often combined (IVF-PQ).</li></ul>", "answer_zh": "<ul><li>HNSW：多层图，相近向量互为邻居，查询时&quot;沿图导航&quot;向查询靠近。快、recall 高，但很费内存。</li><li>IVF：先把向量聚成簇，查询只看离查询最近的几个簇，跳过其余。</li><li>PQ（乘积量化）：压缩手段——把向量切段、用近似值代替，省内存、加速距离计算，代价是精度有损。</li><li>IVF 和 PQ 常组合使用（IVF-PQ）。</li></ul>", "followup": "<ul><li>追问&quot;HNSW 为什么 recall 高还流行？&quot; → 图导航能很快收敛到查询附近，查询快且 recall 高；主要代价是内存大、构建索引慢。</li></ul>", "pitfall": "<ul><li>把三者当成同一层的并列选项；其实 HNSW/IVF 是&quot;怎么找候选&quot;，PQ 是&quot;怎么压缩存储&quot;，可以叠加。</li></ul>"}, {"id": "topics/systems/03-vector-databases.md#q5", "topic": "向量数据库", "domain": "systems", "file": "topics/systems/03-vector-databases.md", "status": "drafted", "difficulty": "进阶", "q_en": "Explain the accuracy", "q_zh": "speed / memory tradeoff, and what metadata filtering is. / 讲讲精度 / 速度 / 内存的权衡，以及什么是 metadata filtering。", "answer_en": "<ul><li>ANN indexes trade off three things: recall (accuracy), query speed, and memory.</li><li>Higher recall usually means slower queries or more memory; compression (like PQ) saves memory but lowers recall.</li><li>Tuning knobs (e.g. HNSW ef_search, IVF nprobe) move you around this triangle.</li><li>Metadata filtering: each vector carries fields (user, date, category), so you can do similarity search only within rows that match the filter.</li></ul>", "answer_zh": "<ul><li>ANN 索引在三者间权衡：recall（精度）、查询速度、内存。</li><li>recall 高通常更慢或更费内存；用 PQ 压缩省内存但 recall 会降。</li><li>调参（如 HNSW 的 ef_search、IVF 的 nprobe）就是在这个三角里挪位置。</li><li>metadata filtering：每条向量带字段（用户、时间、类别），检索时只在满足过滤条件的范围内做相似度搜索。</li></ul>", "followup": "<ul><li>追问&quot;过滤和 ANN 怎么结合？&quot; → 难点在&quot;先过滤还是先检索&quot;：先过滤可能破坏索引结构，先检索再过滤可能候选不够；不同产品的工程做法不同，是个常见难点。</li></ul>", "pitfall": "<ul><li>以为加了 metadata 过滤就一定更快；过滤和 ANN 索引结合不好时反而可能变慢或漏召回。</li></ul>"}, {"id": "topics/systems/04-llm-app-architecture.md#q1", "topic": "LLM 应用架构", "domain": "systems", "file": "topics/systems/04-llm-app-architecture.md", "status": "drafted", "difficulty": "基础", "q_en": "What are the main parts of a production LLM application?", "q_zh": "一个生产级 LLM 应用有哪些主要组成部分？", "answer_en": "<ul><li>It is more than one model call. Typical parts: API layer, orchestration, prompt management, retrieval / RAG, tool calling, post-processing.</li><li>Plus cross-cutting modules: caching, guardrails, fallback / routing, and observability.</li><li>The model is the core, but most engineering work is the &quot;shell&quot; around it that handles cost, safety, speed, and reliability.</li></ul>", "answer_zh": "<ul><li>不只是调一次模型。典型组成：API 层、orchestration（编排）、prompt 管理、检索 / RAG、tool calling、后处理。</li><li>加上横切模块：caching、guardrails、fallback / 路由、observability。</li><li>模型是核心，但大部分工程在外面这层&quot;外壳&quot;，处理成本、安全、速度、可靠性。</li></ul>", "followup": "<ul><li>追问&quot;哪些是 demo 可省、上线必须有的？&quot; → demo 可只留检索+prompt+模型；上线后 guardrails、caching、fallback、observability 基本都得补，因为模型会胡说、会慢、会挂、出问题要能查。</li></ul>", "pitfall": "<ul><li>以为&quot;接个模型 API 就完事了&quot;；生产化的难点恰恰在模型之外的工程外壳。</li></ul>"}, {"id": "topics/systems/04-llm-app-architecture.md#q2", "topic": "LLM 应用架构", "domain": "systems", "file": "topics/systems/04-llm-app-architecture.md", "status": "drafted", "difficulty": "基础", "q_en": "What does orchestration mean, and what role do LangChain", "q_zh": "LlamaIndex play? / 什么是 orchestration？LangChain / LlamaIndex 扮演什么角色？", "answer_en": "<ul><li>Orchestration is the logic that connects all steps: retrieve, build prompt, call the model, call tools, post-process — and decides the order.</li><li>LangChain is more of a general orchestration / agent framework; LlamaIndex focuses more on data and RAG (indexing + retrieval).</li><li>They give ready-made building blocks (prompt templates, retrievers, tool interfaces, chains) so you write less glue code.</li></ul>", "answer_zh": "<ul><li>orchestration 是把各步骤串起来的逻辑：检索、拼 prompt、调模型、调工具、后处理，并决定顺序。</li><li>LangChain 偏通用编排 / agent 框架；LlamaIndex 偏数据 / RAG（索引 + 检索）。</li><li>它们提供现成积木（prompt 模板、retriever、工具接口、chain），少写胶水代码。</li></ul>", "followup": "<ul><li>追问&quot;用框架还是自己写？&quot; → 框架起步快，但有抽象层、隐藏 prompt、调试难、版本耦合；很多团队上线时改用自己写的薄编排，换可控性。没有绝对答案，看团队和复杂度。(EN 一句示范: &quot;Frameworks are great to start, but many teams drop them in production for control.&quot;)</li></ul>", "pitfall": "<ul><li>把 LangChain / LlamaIndex 当成&quot;必须用&quot;的基础设施；它们只是可选的开发框架，不用也能做。</li></ul>"}, {"id": "topics/systems/04-llm-app-architecture.md#q3", "topic": "LLM 应用架构", "domain": "systems", "file": "topics/systems/04-llm-app-architecture.md", "status": "drafted", "difficulty": "进阶", "q_en": "Why and how do you cache in an LLM app? Exact cache vs semantic cache?", "q_zh": "为什么以及怎么在 LLM 应用里做缓存？结果缓存和语义缓存的区别？", "answer_en": "<ul><li>LLM calls are slow and costly, so caching saves money and latency.</li><li>Exact / result cache: same request returns the last result (key is the exact prompt or its hash). Simple and safe, but only hits identical requests.</li><li>Semantic cache: uses embeddings to reuse answers for &quot;similar&quot; questions. Higher hit rate, but risk of returning a wrong answer when two questions look alike but differ — so the similarity threshold matters.</li></ul>", "answer_zh": "<ul><li>LLM 调用慢又贵，缓存省钱降延迟。</li><li>结果缓存：完全相同的请求返回上次结果（key 是精确 prompt 或 hash）。简单可靠，只命中一字不差的重复。</li><li>语义缓存：用 embedding 复用&quot;语义相近&quot;问题的答案。命中率高，但相似问题需求可能不同，会答非所问，阈值要谨慎调。</li></ul>", "followup": "<ul><li>追问&quot;还有别的缓存层吗？&quot; → provider 侧的 prompt caching，缓存长 prompt 的固定前缀（如 system prompt + 文档），省输入侧重复计算。⚠️待核实：各家是否支持、怎么计费不同。</li></ul>", "pitfall": "<ul><li>以为语义缓存总是更好；它会引入&quot;看起来像、其实不一样&quot;的错误命中，安全/正确性敏感场景要慎用或调高阈值。</li></ul>"}, {"id": "topics/systems/04-llm-app-architecture.md#q4", "topic": "LLM 应用架构", "domain": "systems", "file": "topics/systems/04-llm-app-architecture.md", "status": "drafted", "difficulty": "进阶", "q_en": "What are guardrails, and how do you defend against prompt injection?", "q_zh": "什么是 guardrails？怎么防 prompt injection？", "answer_en": "<ul><li>Guardrails are checks on the input and output sides: input validation (including prompt injection detection), output validation (format / schema), and content safety.</li><li>Prompt injection is when a user hides instructions in their input to hijack the model (&quot;ignore the above and do X&quot;).</li><li>Defenses: clearly separate system instructions from user data, limit tool permissions (least privilege), validate outputs, and add human approval for risky actions. There is no single perfect fix.</li></ul>", "answer_zh": "<ul><li>guardrails 是输入 / 输出两端的检查：输入校验（含 prompt injection 检测）、输出校验（格式 / schema）、内容安全。</li><li>prompt injection 指用户在输入里塞指令来劫持模型（&quot;忽略上面，改做 X&quot;）。</li><li>防御：清晰隔离系统指令和用户数据、对工具做最小权限、校验输出、高风险动作加人工确认。没有单一银弹。</li></ul>", "followup": "<ul><li>追问&quot;间接 prompt injection 是什么？&quot; → 恶意指令藏在被检索 / 被读取的外部内容里（网页、文档），模型读到后被劫持，比直接注入更隐蔽，所以对&quot;检索来的内容&quot;也要当成不可信数据处理。</li></ul>", "pitfall": "<ul><li>以为&quot;在 system prompt 里写一句别被骗&quot;就能防住；模型不可靠地区分指令和数据，必须靠工程隔离 + 权限 + 输出校验多层防御。</li></ul>"}, {"id": "topics/systems/04-llm-app-architecture.md#q5", "topic": "LLM 应用架构", "domain": "systems", "file": "topics/systems/04-llm-app-architecture.md", "status": "drafted", "difficulty": "进阶", "q_en": "How do retry, fallback, and multi-model routing work, and why use them?", "q_zh": "重试、fallback、多模型路由分别是什么？为什么要用？", "answer_en": "<ul><li>Retry: automatically retry on timeout, rate limit, or transient errors, usually with exponential backoff.</li><li>Fallback: if the main model fails or is too slow, switch to a backup model or a simpler path so the service stays up.</li><li>Multi-model routing: send requests to different models by difficulty / cost — small fast cheap model for easy questions, big model only for hard ones.</li><li>Together they improve reliability and balance cost vs quality.</li></ul>", "answer_zh": "<ul><li>重试：超时 / 限流 / 偶发错误时自动重试，通常配指数退避。</li><li>fallback：主模型挂了或太慢，切到备用模型或更简单路径，保证服务不断。</li><li>多模型路由：按难度 / 成本分流——简单问题用小而快的便宜模型，难问题才上大模型。</li><li>三者合起来提升可靠性，并平衡成本与质量。</li></ul>", "followup": "<ul><li>追问&quot;路由怎么判断难易？&quot; → 常见用规则（长度 / 关键词）、小分类模型、或先用便宜模型试，不满意再升级（cascade，级联）。</li></ul>", "pitfall": "<ul><li>把 retry 当成万能：对&quot;模型答错&quot;这类非瞬时错误，盲目重试既不省钱也不解决问题，应配合更换 prompt / 模型或人工兜底。</li></ul>"}, {"id": "topics/systems/04-llm-app-architecture.md#q6", "topic": "LLM 应用架构", "domain": "systems", "file": "topics/systems/04-llm-app-architecture.md", "status": "drafted", "difficulty": "高阶", "q_en": "Walk me through the data flow of one request in a RAG + tools app.", "q_zh": "描述一个带 RAG 和工具调用的应用里，单次请求的数据流。", "answer_en": "<ul><li>API layer: auth, rate limit, validate the request.</li><li>Guardrails: check the input, including prompt injection detection.</li><li>Cache: check first; return early on a hit.</li><li>Orchestration: retrieve relevant docs (RAG), build the prompt (template + context + question), call the LLM — which may trigger tool calls and loop a few rounds.</li><li>Post-process: parse / format the output (e.g. extract JSON).</li><li>Output guardrails: check format and content safety; write to cache; return.</li><li>Throughout: observability (tracing / metrics); any failed step goes to retry / fallback.</li></ul>", "answer_zh": "<ul><li>API 层：鉴权、限流、校验请求。</li><li>guardrails：输入校验，含 prompt injection 检测。</li><li>cache：先查缓存，命中直接返回。</li><li>orchestration：检索相关文档（RAG）→ 拼 prompt（模板 + context + 问题）→ 调 LLM（可能触发 tool calling，循环几轮）。</li><li>后处理：解析 / 格式化输出（如抽 JSON）。</li><li>输出 guardrails：校验格式和内容安全 → 写缓存 → 返回。</li><li>全程：observability（tracing / metrics）；任一步失败走 retry / fallback。</li></ul>", "followup": "<ul><li>追问&quot;为什么 cache 查询放在检索和模型调用之前？&quot; → 缓存命中就能跳过最贵的检索和模型调用，省钱降延迟；所以缓存要尽量靠前（但要在 guardrails 之后，避免缓存了恶意输入的结果）。</li></ul>", "pitfall": "<ul><li>把数据流画成一条直线；实际是有环的——tool calling 会让&quot;调模型 → 调工具 → 再调模型&quot;循环多轮，直到模型给出最终答案。</li></ul>"}, {"id": "topics/systems/05-cost-optimization.md#q1", "topic": "成本优化", "domain": "systems", "file": "topics/systems/05-cost-optimization.md", "status": "drafted", "difficulty": "基础", "q_en": "What drives the cost of an LLM application?", "q_zh": "LLM 应用的成本主要由什么决定？", "answer_en": "<ul><li>Most APIs charge per token, and input tokens and output tokens are priced separately (output is usually more expensive).</li><li>Single-call cost ≈ input_tokens × input_price + output_tokens × output_price.</li><li>Total cost ≈ single-call cost × number of calls.</li><li>Bigger / stronger models cost more per token.</li></ul>", "answer_zh": "<ul><li>大多数 API 按 token 计费，input 和 output <strong>分开计价</strong>（output 通常更贵）。</li><li>单次成本 ≈ input token × 单价 + output token × 单价。</li><li>总成本 ≈ 单次成本 × 调用量。</li><li>模型越大越强，单价越高。</li></ul>", "followup": "<ul><li>追问&quot;RAG 应用成本大头通常在哪？&quot; → 往往在 input：检索回来的 context 会让 prompt 很长，token 数飙升。</li></ul>", "pitfall": "<ul><li>以为只按调用次数收费；其实主要看 token 数，长 prompt / 长输出比次数更影响账单。</li><li>忘了 output 通常比 input 单价更贵。</li></ul>"}, {"id": "topics/systems/05-cost-optimization.md#q2", "topic": "成本优化", "domain": "systems", "file": "topics/systems/05-cost-optimization.md", "status": "drafted", "difficulty": "基础", "q_en": "How would you cut LLM cost without hurting quality much?", "q_zh": "怎么在不太影响质量的前提下降低 LLM 成本？", "answer_en": "<ul><li>Use model routing: small / cheap model for easy tasks, big model only for hard ones.</li><li>Shorten the prompt: drop useless context and extra few-shot examples.</li><li>Limit output length with max_tokens and ask for short answers.</li><li>Cache results so repeated or similar requests don&#x27;t hit the model again.</li></ul>", "answer_zh": "<ul><li>model routing：简单任务用小 / 便宜模型，难任务才上大模型。</li><li>缩短 prompt：去掉没用的 context 和多余的 few-shot 例子。</li><li>用 max_tokens 限制输出、要求简短回答。</li><li>加 caching：重复或相似的请求别再调模型。</li></ul>", "followup": "<ul><li>追问&quot;先做哪个？&quot; → 一般先 model routing 和 caching，性价比最高、改动小；prompt 瘦身和 fine-tune 是后续。</li></ul>", "pitfall": "<ul><li>一上来就想 self-host 省钱；量不够大时反而更贵，应先用便宜的优化。</li><li>只盯着省钱忽略质量；要用评测对比优化前后的效果。</li></ul>"}, {"id": "topics/systems/05-cost-optimization.md#q3", "topic": "成本优化", "domain": "systems", "file": "topics/systems/05-cost-optimization.md", "status": "drafted", "difficulty": "进阶", "q_en": "What is model routing and when do you use it?", "q_zh": "什么是 model routing？什么时候用？", "answer_en": "<ul><li>Model routing means picking which model handles a request based on how hard it is.</li><li>Easy tasks (classification, extraction, simple chat) go to a small / cheap model; hard tasks (complex reasoning, code, long synthesis) go to a big model.</li><li>You can route by simple rules (task type, input length) or by a light classifier that scores difficulty.</li><li>It saves money because most traffic is easy and doesn&#x27;t need the strongest model.</li></ul>", "answer_zh": "<ul><li>model routing 就是按请求难度选用哪个模型。</li><li>简单任务（分类、抽取、简单对话）走小 / 便宜模型；难任务（复杂推理、代码、长文综合）走大模型。</li><li>路由可以用规则（任务类型、输入长度）或一个轻量分类器打难度分。</li><li>省钱是因为大部分流量都是简单的，不需要最强模型。</li></ul>", "followup": "<ul><li>追问&quot;路由判断错了怎么办？&quot; → 可设兜底：小模型不确定（如置信度低 / 自评不会）就升级到大模型，叫 cascade / fallback。</li></ul>", "pitfall": "<ul><li>以为路由器本身很贵；它通常是规则或很小的模型，开销远小于省下的钱。</li><li>把 routing 和 multi-agent 混淆；routing 是&quot;选一个模型&quot;，不是让多个模型协作。</li></ul>"}, {"id": "topics/systems/05-cost-optimization.md#q4", "topic": "成本优化", "domain": "systems", "file": "topics/systems/05-cost-optimization.md", "status": "drafted", "difficulty": "进阶", "q_en": "What is semantic caching and how is it different from exact caching?", "q_zh": "什么是语义缓存？和精确缓存有什么不同？", "answer_en": "<ul><li>Exact cache reuses the answer only when the new request is byte-for-byte the same (key = hash of the prompt).</li><li>Semantic cache embeds the request and reuses a past answer when a new one is semantically similar, even if the wording differs.</li><li>Example: &quot;capital of France?&quot; and &quot;what&#x27;s France&#x27;s capital?&quot; can share one cached answer.</li><li>It raises hit rate and saves more calls, but you must set a similarity threshold to avoid wrong reuse.</li></ul>", "answer_zh": "<ul><li>精确缓存只有当新请求<strong>完全一样</strong>时才复用（key = prompt 的 hash）。</li><li>语义缓存把请求做 embedding，<strong>语义相似</strong>就复用，即使措辞不同。</li><li>例子：&quot;法国首都是？&quot; 和 &quot;法国的首都叫什么？&quot; 可以共用一个缓存答案。</li><li>命中率更高、省更多调用，但要设相似度阈值，避免复用错答案。</li></ul>", "followup": "<ul><li>追问&quot;语义缓存有什么风险？&quot; → 阈值太松会把不该复用的也复用了（答非所问）；对时效性强、个性化的请求要慎用甚至关掉缓存。</li></ul>", "pitfall": "<ul><li>以为缓存对所有场景都安全；带用户个人信息、强时效或随机性要求高的请求不适合缓存。</li></ul>"}, {"id": "topics/systems/05-cost-optimization.md#q5", "topic": "成本优化", "domain": "systems", "file": "topics/systems/05-cost-optimization.md", "status": "drafted", "difficulty": "进阶", "q_en": "When should you fine-tune a small model instead of prompting a big one?", "q_zh": "什么时候该 fine-tune 小模型，而不是给大模型写 prompt？", "answer_en": "<ul><li>When one task has high volume and a stable, repeated pattern.</li><li>Fine-tune a small model on examples (often generated by a big model), then serve the small model.</li><li>It lowers per-call price and shortens prompts (no need to stuff many few-shot examples).</li><li>It pays off only if volume is large enough to cover the one-time fine-tuning cost.</li></ul>", "answer_zh": "<ul><li>当某个任务<strong>量大且模式固定、重复</strong>时。</li><li>用例子（常由大模型生成）fine-tune 一个小模型，之后用小模型来服务。</li><li>单价更低、prompt 更短（不用塞一堆 few-shot 例子）。</li><li>只有量足够大、能摊平 fine-tune 的一次性成本时才划算。</li></ul>", "followup": "<ul><li>追问&quot;任务还会变怎么办？&quot; → 任务定义不稳定时别急着 fine-tune，改一次就要重训；先用 prompt + routing 更灵活。</li></ul>", "pitfall": "<ul><li>以为 fine-tune 一定更省；前期数据 + 训练 + 维护是成本，量小时不如直接调 API。</li><li>把 fine-tune 当成提升知识的手段；它更适合固定格式 / 风格 / 任务，不是往模型里灌新事实。</li></ul>"}, {"id": "topics/systems/05-cost-optimization.md#q6", "topic": "成本优化", "domain": "systems", "file": "topics/systems/05-cost-optimization.md", "status": "drafted", "difficulty": "高阶", "q_en": "API vs self-hosting: how do you decide on cost?", "q_zh": "用 API 还是自己部署（self-host）？成本上怎么权衡？", "answer_en": "<ul><li>API is pay-per-use with zero ops; cheaper when volume is small or spiky, and fastest to start.</li><li>Self-hosting an open model is a fixed cost (GPU + ops + scaling); cheaper only at large, steady volume with high utilization.</li><li>Rule of thumb: start with API to validate the product, move to self-host when volume is large and stable, or when you need data privacy / customization.</li><li>Always measure real token usage first, then compare total cost of both options.</li></ul>", "answer_zh": "<ul><li>API 按用量付费、零运维；量小或波动大时更便宜，启动也最快。</li><li>self-host 开源模型是<strong>固定成本</strong>（GPU + 运维 + 扩缩容）；只有量大、稳定、利用率高时才更便宜。</li><li>经验法则：先用 API 验证产品，等量大且稳定、或有数据隐私 / 定制需求时再转 self-host。</li><li>先量出真实 token 用量，再算两种方案的总成本对比。</li></ul>", "followup": "<ul><li>追问&quot;self-host 容易被忽略的成本？&quot; → GPU 闲置（利用率低）、运维 / 扩缩容人力、模型升级维护，这些都摊进总成本。</li></ul>", "pitfall": "<ul><li>只比&quot;每 token 单价&quot;就下结论；要算上固定成本和利用率，低利用率的自建往往比 API 还贵。</li></ul>"}, {"id": "topics/systems/06-monitoring-observability.md#q1", "topic": "监控与可观测性", "domain": "systems", "file": "topics/systems/06-monitoring-observability.md", "status": "drafted", "difficulty": "基础", "q_en": "What should you monitor in an LLM application?", "q_zh": "LLM 应用要监控什么？", "answer_en": "<ul><li>Two groups. System metrics: latency (especially TTFT), throughput, error rate, and cost / token usage.</li><li>Quality metrics: output quality, faithfulness, user feedback (thumbs up/down), and refusal rate.</li><li>The key point: an LLM app can return HTTP 200 but still give a wrong answer, so you must watch quality, not just system health.</li></ul>", "answer_zh": "<ul><li>分两类。系统指标：latency（尤其 TTFT）、throughput、error rate、成本 / token 用量。</li><li>质量指标：输出质量、faithfulness、用户反馈（点赞点踩）、拒答率。</li><li>关键：LLM 应用可能返回 200 但答案是错的，所以光看系统健康不够，必须盯质量。</li></ul>", "followup": "<ul><li>追问&quot;为什么单独提 TTFT 而不只看总延迟？&quot; → 因为多数应用是流式输出，用户感受到的是&quot;多久看到第一个字&quot;，TTFT 直接决定体验，可附一句：(EN) &quot;TTFT is what the user actually feels in a streaming UI.&quot;</li></ul>", "pitfall": "<ul><li>只搬传统服务那套（CPU、500 错误率）就以为够了；漏掉质量监控，结果系统全绿但用户在骂答案差。</li></ul>"}, {"id": "topics/systems/06-monitoring-observability.md#q2", "topic": "监控与可观测性", "domain": "systems", "file": "topics/systems/06-monitoring-observability.md", "status": "drafted", "difficulty": "基础", "q_en": "What is the difference between monitoring and observability?", "q_zh": "monitoring 和 observability 有什么区别？", "answer_en": "<ul><li>Monitoring tells you *what* is wrong: it tracks known metrics like latency, error rate, and cost, and alerts when they cross a threshold.</li><li>Observability tells you *why*: it lets you dig into a single request to find the root cause, mainly through tracing.</li><li>In LLM apps, observability matters a lot because one request can chain retrieval, tools, and several LLM calls.</li></ul>", "answer_zh": "<ul><li>monitoring 告诉你&quot;哪里不对&quot;：盯已知指标（latency、错误率、成本），超阈值就告警。</li><li>observability 告诉你&quot;为什么不对&quot;：能深入到<strong>单次请求</strong>找根因，主要靠 tracing。</li><li>LLM 应用里 observability 尤其重要，因为一次请求会串起检索、工具、多次 LLM 调用。</li></ul>", "followup": "<ul><li>追问&quot;只有指标不够吗？&quot; → 聚合指标只告诉你&quot;整体变慢了&quot;，但说不清是哪一步慢；要定位必须能下钻到单条 trace。</li></ul>", "pitfall": "<ul><li>把两者当同义词。指标是&quot;已知问题的仪表盘&quot;，可观测性是&quot;未知问题的探查能力&quot;。</li></ul>"}, {"id": "topics/systems/06-monitoring-observability.md#q3", "topic": "监控与可观测性", "domain": "systems", "file": "topics/systems/06-monitoring-observability.md", "status": "drafted", "difficulty": "进阶", "q_en": "What is tracing and why is it important for LLM apps?", "q_zh": "什么是 tracing？为什么对 LLM 应用重要？", "answer_en": "<ul><li>A trace records the full path of one request as a tree of spans; each span is a step (retrieval, a tool call, an LLM call) with its own time, input, output, and token count.</li><li>It matters because an LLM request is usually a chain, not a single call.</li><li>When something is slow or wrong, the trace shows *which step* — bad retrieval, a too-long prompt, or one off LLM call.</li></ul>", "answer_zh": "<ul><li>一条 trace 把单次请求的完整路径记成一棵 span 树；每个 span 是一步（检索、工具调用、LLM 调用），带各自的耗时、输入、输出、token 数。</li><li>重要是因为 LLM 请求通常是<strong>一条链</strong>而不是单次调用。</li><li>出问题时，trace 能指出<strong>是哪一步</strong>——检索没召回、prompt 太长、还是某次 LLM 调用跑偏。</li></ul>", "followup": "<ul><li>追问&quot;有哪些工具？&quot; → LangSmith、Langfuse、Arize Phoenix 等专门做 LLM tracing；底层概念和分布式追踪的 OpenTelemetry 一脉相承（⚠️待核实：各工具具体能力 / 定价随版本变化）。</li><li>追问&quot;span 里该记什么？&quot; → 至少：输入、输出、耗时、token 数、用了哪个模型 / 哪些检索文档。</li></ul>", "pitfall": "<ul><li>以为 tracing 就是打日志。日志是零散事件；trace 是<strong>带父子关系和时序</strong>的结构，能还原整条因果链。</li></ul>"}, {"id": "topics/systems/06-monitoring-observability.md#q4", "topic": "监控与可观测性", "domain": "systems", "file": "topics/systems/06-monitoring-observability.md", "status": "drafted", "difficulty": "进阶", "q_en": "How do you evaluate quality online, and what are the trade-offs?", "q_zh": "怎么做在线质量评估？各有什么取舍？", "answer_en": "<ul><li>Two main signals. User feedback: thumbs up/down, regenerate, copy — cheap to collect but sparse and biased.</li><li>LLM-as-judge: use another LLM to score a *sample* of live requests on faithfulness, helpfulness, etc. — scalable but the judge itself can be wrong or biased.</li><li>Best practice: combine both, sample instead of scoring everything, and spot-check the judge with humans.</li></ul>", "answer_zh": "<ul><li>两类主要信号。用户反馈：点赞点踩、重生成、复制——便宜但稀疏、有偏。</li><li>LLM-as-judge：用另一个 LLM 对<strong>抽样</strong>的线上请求按 faithfulness、有用性等打分——能规模化，但裁判自己也会错、有偏好。</li><li>实践：两者结合，<strong>抽样</strong>而非全量评，再用人工抽检校准裁判。</li></ul>", "followup": "<ul><li>追问&quot;online eval 和 offline eval 区别？&quot; → offline 是上线前用固定测试集打分；online 是对真实流量持续评，能抓到测试集覆盖不到的真实问题。</li><li>追问&quot;为什么不全量用 LLM-as-judge？&quot; → 贵且慢，对每条请求都跑等于成本翻倍，所以抽样。</li></ul>", "pitfall": "<ul><li>把 LLM-as-judge 的分当绝对真值；它只是个有噪声的代理指标，必须人工校准、看趋势而非单点。</li></ul>"}, {"id": "topics/systems/06-monitoring-observability.md#q5", "topic": "监控与可观测性", "domain": "systems", "file": "topics/systems/06-monitoring-observability.md", "status": "drafted", "difficulty": "进阶", "q_en": "What is drift in an LLM application, and how do you detect it?", "q_zh": "LLM 应用里的 drift 是什么？怎么检测？", "answer_en": "<ul><li>Drift means the world changed but the system did not. Input drift: users start asking different kinds of questions. Quality drift: output quality slowly drops over time.</li><li>Causes include the provider silently updating the model, a stale retrieval index, or a changing user base.</li><li>Detect it by tracking the distribution of inputs and the time trend of key quality metrics, then alert on anomalies.</li></ul>", "answer_zh": "<ul><li>drift 指&quot;世界变了但系统没变&quot;。输入漂移：用户开始问不同类型的问题。质量漂移：输出质量随时间慢慢下滑。</li><li>成因：供应商悄悄更新了模型、检索库过期、用户群变化。</li><li>检测：跟踪输入特征的分布、关键质量指标的时间趋势，异常就告警。</li></ul>", "followup": "<ul><li>追问&quot;用 API 模型也会 drift 吗？&quot; → 会，而且更隐蔽——你不控权重，供应商更新或下线某版本，你的输出可能一夜变样，所以更要持续监控。</li></ul>", "pitfall": "<ul><li>以为只有自训模型才会漂移；调 API 同样会，且因为不可控反而更需要盯。</li></ul>"}, {"id": "topics/systems/06-monitoring-observability.md#q6", "topic": "监控与可观测性", "domain": "systems", "file": "topics/systems/06-monitoring-observability.md", "status": "drafted", "difficulty": "高阶", "q_en": "How would you log prompts and outputs without leaking user privacy?", "q_zh": "怎么在记录 prompt 和 output 的同时不泄露用户隐私？", "answer_en": "<ul><li>Prompts and outputs often contain PII (names, emails, chat content), so do not log everything blindly.</li><li>Use redaction / masking on sensitive fields, sample instead of logging full traffic, set access control and a retention limit, and follow rules like GDPR.</li><li>The goal is to keep enough to debug and replay, while limiting exposure.</li></ul>", "answer_zh": "<ul><li>prompt 和 output 常含 PII（姓名、邮箱、聊天内容），不能不假思索全量记录。</li><li>做法：对敏感字段脱敏 / mask、按需采样而非全量、设访问权限和保留期限、遵守 GDPR 等合规。</li><li>目标：留下足够复盘和回放（replay）的信息，同时把暴露面降到最低。</li></ul>", "followup": "<ul><li>追问&quot;全脱敏会不会让日志没法 debug？&quot; → 是个权衡：可对低敏字段保留、高敏字段脱敏，或对内部受限人群短期保留原文，到期即删。</li></ul>", "pitfall": "<ul><li>为了&quot;方便排查&quot;把完整原始 prompt 长期全量存下来；这是隐私和合规的大坑。</li></ul>"}, {"id": "topics/systems/07-mlops-llmops.md#q1", "topic": "MLOps / LLMOps", "domain": "systems", "file": "topics/systems/07-mlops-llmops.md", "status": "drafted", "difficulty": "基础", "q_en": "What is MLOps?", "q_zh": "什么是 MLOps？", "answer_en": "<ul><li>MLOps applies DevOps ideas to the whole ML lifecycle: data, training, deployment, and monitoring.</li><li>The goal is to make ML systems automated, repeatable, and traceable, not just a one-off demo.</li><li>It covers things like versioning, experiment tracking, CI/CD, and production monitoring.</li></ul>", "answer_zh": "<ul><li>MLOps 把 DevOps 思想用到整个 ML 生命周期：数据、训练、部署、监控。</li><li>目标是让 ML 系统<strong>自动化、可重复、可回溯</strong>，而不是一次性的 demo。</li><li>涵盖 versioning、experiment tracking、CI/CD、线上监控等。</li></ul>", "followup": "<ul><li>追问&quot;和普通 DevOps 比多了什么？&quot; → ML 的输出还依赖<strong>数据和模型</strong>，所以除了代码，还要版本化数据 / 模型，CI 要测数据和指标，监控要盯 data drift。</li></ul>", "pitfall": "<ul><li>以为 MLOps 就是&quot;部署模型&quot;；部署只是其中一环，它是覆盖整个生命周期的工程实践。</li></ul>"}, {"id": "topics/systems/07-mlops-llmops.md#q2", "topic": "MLOps / LLMOps", "domain": "systems", "file": "topics/systems/07-mlops-llmops.md", "status": "drafted", "difficulty": "基础", "q_en": "Why must you version data and models, not just code?", "q_zh": "为什么不只版本化代码，还要版本化数据和模型？", "answer_en": "<ul><li>In ML, the result depends on code, data, config, and the trained model together.</li><li>If you only version code, you still cannot reproduce a past result when the data changed.</li><li>So to reproduce an experiment you need to lock all four: code, data, model, and config.</li></ul>", "answer_zh": "<ul><li>ML 的结果由<strong>代码 + 数据 + 配置 + 训出的模型</strong>共同决定。</li><li>只版本化代码不够：数据一变，结果就变，还是复现不出来。</li><li>要复现一次实验，必须同时锁定这四样。</li></ul>", "followup": "<ul><li>追问&quot;数据那么大怎么版本化？&quot; → 一般不复制整份数据，而是记录数据的<strong>快照 / 引用 / 哈希</strong>（如数据版本工具或对象存储里的版本号），代码里只存指针。</li></ul>", "pitfall": "<ul><li>以为 git 提交代码就能复现实验；数据和模型权重通常不进 git，得用专门的版本化手段。</li></ul>"}, {"id": "topics/systems/07-mlops-llmops.md#q3", "topic": "MLOps / LLMOps", "domain": "systems", "file": "topics/systems/07-mlops-llmops.md", "status": "drafted", "difficulty": "进阶", "q_en": "What is experiment tracking and why does it matter?", "q_zh": "什么是 experiment tracking？为什么重要？", "answer_en": "<ul><li>Experiment tracking records each run&#x27;s hyperparameters, metrics, artifacts, and the code/data version it used.</li><li>It lets you compare many runs and pick the best one, instead of trusting memory or a spreadsheet.</li><li>It also makes a good run reproducible, because everything that produced it is logged.</li></ul>", "answer_zh": "<ul><li>experiment tracking 记录每次实验的<strong>超参、指标、产物（artifact）、对应代码 / 数据版本</strong>。</li><li>让你能横向对比几十次实验、挑出最好的，而不是靠脑子或 Excel。</li><li>也让好的实验<strong>可复现</strong>，因为产生它的所有信息都被记下来了。</li></ul>", "followup": "<ul><li>追问&quot;和 versioning 什么关系？&quot; → tracking 是&quot;记录每次跑了什么、结果如何&quot;；versioning 是&quot;锁定代码 / 数据 / 模型的具体版本&quot;。tracking 往往<strong>引用</strong> version，二者配合才能真正复现。</li></ul>", "pitfall": "<ul><li>把 tracking 当成只是存指标；它还要把指标和<strong>具体的代码 / 数据 / 配置版本</strong>绑起来才有意义。</li></ul>"}, {"id": "topics/systems/07-mlops-llmops.md#q4", "topic": "MLOps / LLMOps", "domain": "systems", "file": "topics/systems/07-mlops-llmops.md", "status": "drafted", "difficulty": "进阶", "q_en": "What is the difference between shadow, canary, and A/B deployment?", "q_zh": "shadow、canary、A/B 部署有什么区别？", "answer_en": "<ul><li>Shadow: the new model gets the same live traffic as the old one, but its output is <strong>not</strong> returned to users — it is only logged and compared. Zero user risk.</li><li>Canary: route a <strong>small share</strong> of real traffic (e.g. 5%) to the new model, watch the metrics, then ramp up slowly.</li><li>A/B test: split traffic into two groups, one per model, and compare <strong>business metrics</strong> to decide which is better.</li></ul>", "answer_zh": "<ul><li><strong>shadow（影子）</strong>：新模型和老模型收同样的线上流量，但结果<strong>不返回给用户</strong>，只记录 / 对比。对用户零风险，用来验证。</li><li><strong>canary（金丝雀）</strong>：先把<strong>一小部分</strong>真实流量（如 5%）切给新模型，盯指标没问题再逐步放量。</li><li><strong>A/B test</strong>：流量分两组分别走新 / 老模型，用<strong>业务指标统计对比</strong>谁更好。</li></ul>", "followup": "<ul><li>追问&quot;什么时候用哪个？&quot; → 想零风险纯验证用 shadow；想小步上线、随时回滚用 canary；想科学判定&quot;哪个对业务更好&quot;用 A/B（要够样本量和统计显著）。</li></ul>", "pitfall": "<ul><li>把 shadow 和 canary 搞反：shadow 的结果<strong>不给用户</strong>，canary 是<strong>真给一小部分用户</strong>。</li><li>以为 A/B 只是&quot;切流量&quot;；它核心是<strong>统计对比业务指标</strong>做决策，不只是技术验证。</li></ul>"}, {"id": "topics/systems/07-mlops-llmops.md#q5", "topic": "MLOps / LLMOps", "domain": "systems", "file": "topics/systems/07-mlops-llmops.md", "status": "drafted", "difficulty": "高阶", "q_en": "How does LLMOps differ from traditional MLOps?", "q_zh": "LLMOps 和传统 MLOps 有什么不同？", "answer_en": "<ul><li>Many teams no longer train from scratch; they use a ready-made base model plus an API.</li><li>So the focus shifts from training to prompt, RAG, eval, cost, and guardrails.</li><li>Prompts must be treated like code: versioned, put in the pipeline, and rollback-able.</li><li>Eval is harder because output is open text — teams use LLM-as-judge, human review, and versioned eval sets.</li><li>Cost and latency become first-class, since you pay per token.</li></ul>", "answer_zh": "<ul><li>很多团队<strong>不再从头训练</strong>，而是用现成基座模型 + API。</li><li>工程重心从训练挪到 <strong>prompt / RAG / eval / 成本 / 护栏（guardrails）</strong>。</li><li><strong>prompt 要当代码管</strong>：版本化、进流水线、可回滚（改一句话效果就可能剧变）。</li><li><strong>eval 更难</strong>：输出是开放文本，没有简单准确率，常用 LLM-as-judge、人工评测、版本化的 eval 集。</li><li><strong>成本 / 延迟变成一等公民</strong>，因为按 token 计费。</li></ul>", "followup": "<ul><li>追问&quot;那 LLMOps 还需要 versioning 吗？&quot; → 需要，而且范围更广：除了代码 / 数据 / 模型，还要把 <strong>prompt 和 eval 集</strong>也版本化，才能在换模型或改 prompt 后做可靠对比。</li><li>追问&quot;为什么 prompt 也要进 CI/CD？&quot; → prompt 改动像代码改动一样能直接改变线上行为，要有评测门槛和回滚，否则上线即翻车。</li></ul>", "pitfall": "<ul><li>以为用了大模型就不用 MLOps 了；其实监控、版本化、CI/CD 仍在，只是对象变成了 prompt / RAG / eval。</li><li>把 LLMOps 等同于&quot;调 prompt&quot;；它是一整套运维实践，prompt 只是其中一块。</li></ul>"}, {"id": "topics/systems/08-data-privacy.md#q1", "topic": "数据与隐私", "domain": "systems", "file": "topics/systems/08-data-privacy.md", "status": "drafted", "difficulty": "基础", "q_en": "What is PII and why does it matter in LLM apps?", "q_zh": "什么是 PII？在 LLM 应用里为什么重要？", "answer_en": "<ul><li>PII means Personally Identifiable Information — data that can identify a person, like name, email, phone, ID number.</li><li>Some fields alone identify someone; some (like birth date plus zip code) identify when combined.</li><li>It matters because LLM apps send user data to models and store logs, so PII can leak or be misused, which causes privacy harm and legal risk.</li></ul>", "answer_zh": "<ul><li>PII 是个人可识别信息：能定位到具体个人的数据，如姓名、邮箱、手机号、身份证号。</li><li>有的字段单独就能认人；有的（如出生日期 + 邮编）组合起来才能认人。</li><li>重要是因为 LLM 应用会把用户数据发给模型、还会存日志，PII 可能泄露或被滥用，带来隐私伤害和法律风险。</li></ul>", "followup": "<ul><li>追问&quot;哪些算更敏感？&quot; → 健康、种族、宗教、生物特征等属 sensitive / special category，监管要求更严，处理要更谨慎。</li></ul>", "pitfall": "<ul><li>以为只有姓名身份证才是 PII；间接标识符组合起来也能认人，同样要保护。</li></ul>"}, {"id": "topics/systems/08-data-privacy.md#q2", "topic": "数据与隐私", "domain": "systems", "file": "topics/systems/08-data-privacy.md", "status": "drafted", "difficulty": "基础", "q_en": "What are the risks of sending user data to a third-party LLM API?", "q_zh": "把用户数据发给第三方 LLM API 有什么风险？", "answer_en": "<ul><li>Once data leaves your boundary, the provider controls it, not you.</li><li>Three key questions: is my data used for training? is it stored, and for how long? where does it flow (which region, which sub-processors)?</li><li>This is a contract and config issue — check the data processing agreement and turn off training / log retention if possible.</li></ul>", "answer_zh": "<ul><li>数据一旦离开你的边界，控制权就归供应商，不归你。</li><li>三个关键问题：会不会被用于训练？会不会留存、留多久？数据流向哪里（哪个地区、哪些子处理方）？</li><li>这是合同 + 配置问题——看数据处理协议（DPA），能关训练、关日志留存就关。</li></ul>", "followup": "<ul><li>追问&quot;企业版 API 默认会拿数据训练吗？&quot; → 很多企业/API 方案<strong>默认不</strong>用于训练，但这是政策/合同问题，<strong>⚠️待核实</strong> 具体供应商当下条款，别一口咬定。</li></ul>", "pitfall": "<ul><li>以为&quot;调 API 数据就一定安全/一定不被训练&quot;；要看具体合同和配置，不能默认。</li></ul>"}, {"id": "topics/systems/08-data-privacy.md#q3", "topic": "数据与隐私", "domain": "systems", "file": "topics/systems/08-data-privacy.md", "status": "drafted", "difficulty": "进阶", "q_en": "How do you detect and redact PII before it reaches the model?", "q_zh": "怎么在数据进入模型前检测并脱敏 PII？", "answer_en": "<ul><li>Detection: use rules (regex for emails, card numbers) plus a model (NER) to find PII.</li><li>Redaction: replace PII with placeholders like <code>[NAME]</code>, or mask it.</li><li>A common pattern: replace with <code>[PERSON_1]</code>, keep a mapping in memory, then map back after the model answers — so the model never sees the real value but the user still gets a normal result.</li></ul>", "answer_zh": "<ul><li>检测：用规则（正则匹配邮箱、卡号）+ 模型（NER 命名实体识别）找出 PII。</li><li>脱敏：把 PII 换成 <code>[NAME]</code> 这样的占位符，或打码。</li><li>常见做法：替成 <code>[PERSON_1]</code>，内存里存一张映射表，模型答完再换回真实值——模型不接触真名，用户仍得到正常结果。</li></ul>", "followup": "<ul><li>追问&quot;假名化和匿名化有啥区别？&quot; → pseudonymization（假名化）可逆、还能还原；anonymization（匿名化）不可逆、彻底去标识，监管上待遇不同（匿名化后常被视为不再是个人数据）。</li></ul>", "pitfall": "<ul><li>以为正则就够了；正则会漏（如不规范写法的姓名），通常要正则 + NER 模型互补，且没有 100% 准确，要有兜底。</li></ul>"}, {"id": "topics/systems/08-data-privacy.md#q4", "topic": "数据与隐私", "domain": "systems", "file": "topics/systems/08-data-privacy.md", "status": "drafted", "difficulty": "进阶", "q_en": "What is data minimization and retention, and why do they reduce risk?", "q_zh": "什么是数据最小化和数据保留？为什么能降低风险？", "answer_en": "<ul><li>Data minimization: only collect and send the data the task really needs; don&#x27;t dump a full user record into the prompt.</li><li>Retention: define how long data is kept and delete it when it expires; don&#x27;t keep raw PII in logs forever.</li><li>Less data and shorter storage means a smaller attack surface and easier compliance — you can&#x27;t leak what you don&#x27;t hold.</li></ul>", "answer_zh": "<ul><li>数据最小化：只收集、只发送任务真正需要的数据，别把整条用户记录塞进 prompt。</li><li>数据保留：定义数据存多久、到期就删；别在日志里长期存原始 PII。</li><li>数据少、存得短 = 攻击面小、合规更容易——你没存的东西就泄不出去。</li></ul>", "followup": "<ul><li>追问&quot;日志一定要存怎么办？&quot; → 存之前先脱敏/打码、设保留期限到期自动删、加访问控制，别存明文 PII。</li></ul>", "pitfall": "<ul><li>以为&quot;多存点数据以后可能有用&quot;是好事；从隐私/合规看，不必要的留存是负债，不是资产。</li></ul>"}, {"id": "topics/systems/08-data-privacy.md#q5", "topic": "数据与隐私", "domain": "systems", "file": "topics/systems/08-data-privacy.md", "status": "drafted", "difficulty": "高阶", "q_en": "What privacy risks come from training or fine-tuning on data?", "q_zh": "用数据训练 / 微调会带来哪些隐私风险？", "answer_en": "<ul><li>Memorization: the model can memorize rare snippets from training data and output them verbatim later.</li><li>Data extraction: an attacker uses crafted prompts to pull private training data back out.</li><li>Membership inference: an attacker figures out whether a specific record was in the training set — which itself can be sensitive (e.g. medical).</li><li>Mitigations: clean and dedup PII before training, limit repeated samples, consider differential privacy, and filter outputs.</li></ul>", "answer_zh": "<ul><li>memorization（记忆）：模型记住训练集里的稀有片段，之后可能原样吐出来。</li><li>数据提取（extraction）：攻击者用精心构造的 prompt 把训练数据里的隐私套出来。</li><li>成员推断（membership inference）：攻击者判断&quot;某条具体数据是否在训练集里&quot;，这本身就可能泄露隐私（如医疗场景）。</li><li>缓解：训练前清洗去重 PII、限制重复样本、考虑 differential privacy、对输出做过滤。</li></ul>", "followup": "<ul><li>追问&quot;为什么重复样本更危险？&quot; → 同一条数据出现越多次，模型越容易记住它、越容易被原样吐出，所以去重很关键。</li><li>追问&quot;differential privacy 能彻底解决吗？&quot; → 它用加噪等手段降低单条数据的影响，但有隐私 ↔ 效果的权衡，<strong>⚠️待核实</strong> 具体参数与效果取决于实现，不是银弹。</li></ul>", "pitfall": "<ul><li>以为&quot;模型只学规律不记原文&quot;；实际会 memorize 稀有片段，尤其重复出现的，所以训练数据隐私不能忽视。</li></ul>"}, {"id": "topics/systems/08-data-privacy.md#q6", "topic": "数据与隐私", "domain": "systems", "file": "topics/systems/08-data-privacy.md", "status": "drafted", "difficulty": "高阶", "q_en": "On-prem", "q_zh": "self-hosting vs API — how do you weigh the privacy trade-off? / 自托管 vs 调 API，隐私上怎么权衡？", "answer_en": "<ul><li>API (cloud): fast to use, low ops, but data leaves your boundary and you rely on the provider&#x27;s contract and config.</li><li>On-prem / self-hosted open model: data stays inside your boundary, best privacy control, but you pay in GPUs, ops, and possibly weaker models.</li><li>Middle ground: some providers offer VPC / private deployment / no-retention modes.</li><li>The real choice is privacy control vs cost and capability — decide by how sensitive the data is.</li></ul>", "answer_zh": "<ul><li>API（云端）：上手快、省运维，但数据要出门，依赖供应商合同与配置。</li><li>on-prem / 自托管开源模型：数据不出自己边界，隐私可控性最高；代价是 GPU、运维成本，模型可能偏弱。</li><li>折中：有些供应商提供 VPC / 私有部署 / 不留存模式。</li><li>本质权衡是隐私可控性 ↔ 成本与能力，按数据敏感度来定。</li></ul>", "followup": "<ul><li>追问&quot;什么情况下值得自托管？&quot; → 数据极敏感（医疗、金融、政府）、合规要求数据不能出境/出公司，或量大到自托管更省时。</li></ul>", "pitfall": "<ul><li>以为自托管就&quot;绝对安全&quot;；自托管只是把信任从供应商挪回自己，访问控制、审计、运维安全还是得自己做好。</li></ul>"}];
const $ = s => document.querySelector(s);
const CARDMAP = Object.fromEntries(CARDS.map(c => [c.id, c]));
const SKEY = 'aie-srs-v1';
const DAY = 86400000;
let srs = JSON.parse(localStorage.getItem(SKEY) || '{}');
let lang = 'both', mode = 'study', studyAll = false;
let session = [], revealed = false;

function saveSrs(){ localStorage.setItem(SKEY, JSON.stringify(srs)); }
function st(id){ return srs[id] || (srs[id] = {ease:2.5, ivl:0, due:0, reps:0}); }

function fillSelect(sel, vals){
  for(const v of [...new Set(vals)].filter(Boolean).sort())
    sel.insertAdjacentHTML('beforeend', `<option>${v}</option>`);
}
fillSelect($('#fDomain'), CARDS.map(c=>c.domain));
fillSelect($('#fDiff'), CARDS.map(c=>c.difficulty));
function refreshTopics(){
  const d = $('#fDomain').value, s = $('#fTopic');
  s.innerHTML = '<option value="">全部主题</option>';
  fillSelect(s, CARDS.filter(c=>!d||c.domain===d).map(c=>c.topic));
}
refreshTopics();

function filtered(){
  const d=$('#fDomain').value, t=$('#fTopic').value, f=$('#fDiff').value;
  return CARDS.filter(c=>(!d||c.domain===d)&&(!t||c.topic===t)&&(!f||c.difficulty===f));
}
function buildSession(){
  const now = Date.now();
  let pool = filtered();
  if(!studyAll) pool = pool.filter(c => st(c.id).due <= now);
  session = pool.map(c => c.id);
  revealed = false;
}

function nextIvl(s, g){
  if(g==='hard') return s.ivl ? Math.max(1, Math.round(s.ivl*1.2)) : 1;
  if(g==='good') return s.ivl ? Math.round(s.ivl*s.ease) : 1;
  return s.ivl ? Math.round(s.ivl*s.ease*1.3) : 3;          // easy
}
function ivlLabel(s, g){ return g==='again' ? '<10分' : nextIvl(s,g)+'天'; }

function grade(g){
  const id = session[0], s = st(id);
  s.reps++;
  if(g==='again'){ s.ease=Math.max(1.3,s.ease-0.2); s.ivl=0; s.due=Date.now(); }
  else { if(g==='hard') s.ease=Math.max(1.3,s.ease-0.15); if(g==='easy') s.ease+=0.15;
         s.ivl=nextIvl(s,g); s.due=Date.now()+s.ivl*DAY; }
  saveSrs();
  session.shift();
  if(g==='again') session.splice(Math.min(session.length,3),0,id);   // 稍后再出现
  revealed=false;
  renderStudy();
}

function answerHtml(c){
  return (c.answer_en?`<h4 class="ans-en">Answer (EN)</h4><div class="ans-en">${c.answer_en}</div>`:'')
    + (c.answer_zh?`<h4 class="ans-zh">核心答案</h4><div class="ans-zh">${c.answer_zh}</div>`:'')
    + (c.followup?`<h4>追问 / 深入</h4>${c.followup}`:'')
    + (c.pitfall?`<h4>常见误区</h4>${c.pitfall}`:'');
}

function renderStudy(){
  const wrap = $('#study'); wrap.className = 'lang-'+lang;
  updateStats();
  if(!session.length){
    const any = filtered().length;
    wrap.innerHTML = `<div class="done">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 12l3 3 5-6"></path></svg>
      <div class="big">${studyAll?'全部过完了':'这组今天复习完了'}</div>`
      + (any?`<button id="againAll" class="ghost">${studyAll?'再过一遍':'无视进度 · 全部再学一遍'}</button>`:'<p>没有卡片，换个筛选试试。</p>')
      + `</div>`;
    const b=$('#againAll'); if(b) b.onclick=()=>{ studyAll=true; buildSession(); renderStudy(); };
    return;
  }
  const c = CARDMAP[session[0]], s = st(c.id);
  wrap.innerHTML = `<div class="scard">
    <div class="badges"><span class="badge">${c.domain}</span><span class="badge">${c.topic}</span><span class="badge">${c.difficulty}</span></div>
    <div class="q"><span class="en">${c.q_en||''}</span><span class="zh">${c.q_zh||''}</span></div>
    <div class="ans ${revealed?'':'hidden'}">${answerHtml(c)}</div>
    <div class="actions">${revealed
      ? `<div class="grades">
          <button class="g-again" data-g="again">重来<small>${ivlLabel(s,'again')}</small></button>
          <button class="g-hard" data-g="hard">难<small>${ivlLabel(s,'hard')}</small></button>
          <button class="g-good" data-g="good">良<small>${ivlLabel(s,'good')}</small></button>
          <button class="g-easy" data-g="easy">简单<small>${ivlLabel(s,'easy')}</small></button></div>`
      : `<button class="reveal" id="reveal">显示答案<small>空格</small></button>`}</div>
  </div>`;
  if(!revealed) $('#reveal').onclick=()=>{ revealed=true; renderStudy(); };
  else wrap.querySelectorAll('[data-g]').forEach(b=> b.onclick=()=>grade(b.dataset.g));
}

function renderBrowse(){
  const wrap=$('#browse'); wrap.className='lang-'+lang;
  const list=filtered();
  wrap.innerHTML = list.length ? list.map(c=>`<div class="card">
    <div class="badges"><span class="badge">${c.domain}</span><span class="badge">${c.topic}</span><span class="badge">${c.difficulty}</span></div>
    <div class="q"><span class="en">${c.q_en||''}</span><span class="zh">${c.q_zh||''}</span></div>
    <details><summary>显示答案</summary><div class="ans">${answerHtml(c)}</div></details>
  </div>`).join('') : '<div class="empty">没有匹配的卡片</div>';
}

function updateStats(){
  const now=Date.now(), fil=filtered();
  const due=fil.filter(c=>st(c.id).due<=now).length;
  const learned=fil.filter(c=>st(c.id).reps>0).length;
  $('#stats').innerHTML = mode==='study'
    ? `待学 <b>${session.length}</b> · 到期 <b>${due}</b> · 共 <b>${fil.length}</b>`
    : `共 <b>${fil.length}</b> 卡 · 学过 <b>${learned}</b>`;
}

function rerender(){ mode==='study' ? renderStudy() : renderBrowse(); }
function refilter(){ if(mode==='study'){ studyAll=false; buildSession(); } rerender(); }

$('#fDomain').onchange=()=>{ refreshTopics(); refilter(); };
$('#fTopic').onchange=refilter;
$('#fDiff').onchange=refilter;
$('#lang').onclick=e=>{ if(e.target.dataset.l){ lang=e.target.dataset.l;
  [...e.target.parentNode.children].forEach(b=>b.classList.toggle('on',b===e.target)); rerender(); } };
$('#mode').onclick=e=>{ if(e.target.dataset.m){ mode=e.target.dataset.m;
  [...e.target.parentNode.children].forEach(b=>b.classList.toggle('on',b===e.target));
  $('#study').classList.toggle('hidden',mode!=='study');
  $('#browse').classList.toggle('hidden',mode!=='browse');
  if(mode==='study'){ studyAll=false; buildSession(); } rerender(); } };
$('#reset').onclick=()=>{ if(confirm('清空所有学习进度？')){ srs={}; saveSrs(); studyAll=false; buildSession(); rerender(); } };

document.addEventListener('keydown', e=>{
  if(mode!=='study' || !session.length) return;
  if((e.key===' '||e.key==='Enter') && !revealed){ e.preventDefault(); revealed=true; renderStudy(); }
  else if(revealed && ['1','2','3','4'].includes(e.key)){
    grade({'1':'again','2':'hard','3':'good','4':'easy'}[e.key]); }
});

buildSession(); rerender();
</script>
</body>
</html>

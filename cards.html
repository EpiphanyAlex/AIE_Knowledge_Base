<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIE 抽认卡</title>
<style>
:root{--bg:#0f1115;--panel:#181b22;--card:#1f232c;--line:#2b303b;--fg:#e6e8ec;--mut:#9aa3b2;--acc:#4f8cff;
--again:#ff6b6b;--hard:#f0a43a;--good:#2ecc71;--easy:#4f8cff;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar>strong{font-size:16px;margin-right:4px}
select,button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);border-radius:0}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:#fff}
.stats{margin-left:auto;color:var(--mut);font-size:13px}.stats b{color:var(--fg)}
.hidden{display:none}
#study{max-width:680px;margin:34px auto;padding:0 16px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.badge{font-size:11px;color:var(--mut);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.q{font-size:19px;font-weight:600;line-height:1.5}
.q .zh{display:block;color:var(--mut);font-weight:500;font-size:16px;margin-top:6px}
.ans{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px}
.ans h4{margin:14px 0 4px;font-size:12px;color:var(--acc);text-transform:uppercase;letter-spacing:.04em}
.ans h4:first-child{margin-top:0}
.ans ul{margin:4px 0;padding-left:18px}.ans p{margin:4px 0}
.ans code{background:var(--panel);padding:1px 5px;border-radius:4px;font-size:12px}
.actions{margin-top:20px}
.reveal{width:100%;padding:13px;font-size:15px;background:var(--acc);color:#fff;border-color:var(--acc)}
.reveal small{opacity:.8;font-size:11px;margin-left:6px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{display:flex;flex-direction:column;gap:2px;padding:11px 4px;font-size:14px;font-weight:600}
.grades small{font-weight:500;font-size:11px;opacity:.85}
.g-again{background:var(--again);border-color:var(--again);color:#2a0606}
.g-hard{background:var(--hard);border-color:var(--hard);color:#2a1c06}
.g-good{background:var(--good);border-color:var(--good);color:#06210f}
.g-easy{background:var(--easy);border-color:var(--easy);color:#fff}
.done{text-align:center;color:var(--mut);padding:50px 10px}
.done .big{font-size:22px;color:var(--fg);margin-bottom:18px}
.done button{padding:11px 18px;background:var(--acc);color:#fff;border-color:var(--acc)}
#browse{max-width:1100px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
#browse .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
#browse .q{font-size:15px}#browse .q .zh{font-size:14px}
#browse details{margin-top:10px}
#browse summary{cursor:pointer;color:var(--acc);font-size:13px}
#browse .ans{margin-top:10px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px}
.lang-en .zh,.lang-en .ans-zh{display:none}
.lang-zh .en,.lang-zh .ans-en{display:none}
</style>
</head>
<body>
<header><div class="bar">
<strong>AIE 抽认卡</strong>
<div class="seg" id="mode"><button data-m="study" class="on">学习</button><button data-m="browse">浏览</button></div>
<select id="fDomain"><option value="">全部领域</option></select>
<select id="fTopic"><option value="">全部主题</option></select>
<select id="fDiff"><option value="">全部难度</option></select>
<div class="seg" id="lang"><button data-l="both" class="on">中英</button><button data-l="en">EN</button><button data-l="zh">中</button></div>
<span class="stats" id="stats"></span>
<button id="reset">重置进度</button>
</div></header>
<main id="study"></main>
<main id="browse" class="hidden"></main>
<script>
const CARDS = [{"id": "topics/llm/01-transformer.md#q1", "topic": "Transformer 架构总览", "domain": "llm", "file": "topics/llm/01-transformer.md", "status": "drafted", "difficulty": "基础", "q_en": "What is a Transformer and why did it replace RNNs?", "q_zh": "什么是 Transformer？它为什么取代了 RNN？", "answer_en": "<ul><li>A Transformer is a neural network architecture built around attention instead of recurrence.</li><li>It looks at the whole sequence at once, so it trains in parallel and is much faster than RNNs.</li><li>It also connects any two tokens directly, so it handles long-range relations better.</li></ul>", "answer_zh": "<ul><li>Transformer 是一种以 <strong>attention</strong> 为核心、不用循环(recurrence)的网络架构。</li><li>它<strong>一次看整个序列</strong>，可以并行训练，比 RNN 快很多。</li><li>任意两个 token 直接相连，长距离关系处理得更好。</li></ul>", "followup": "<ul><li>追问&quot;那 Transformer 有什么代价？&quot; → 计算量随序列长度是 O(n²)，长上下文很贵（见 <code>02-attention</code> Q5）。</li></ul>", "pitfall": "<ul><li>以为 Transformer 是某个具体模型；它是一类<strong>架构</strong>，GPT、BERT 都基于它。</li></ul>"}, {"id": "topics/llm/01-transformer.md#q2", "topic": "Transformer 架构总览", "domain": "llm", "file": "topics/llm/01-transformer.md", "status": "drafted", "difficulty": "基础", "q_en": "What are the main parts of a Transformer block?", "q_zh": "一个 Transformer 层里主要有哪些部分？", "answer_en": "<ul><li>Two main sub-layers: multi-head self-attention, then a feed-forward network (FFN).</li><li>Each sub-layer is wrapped with a residual connection and layer normalization.</li><li>We stack many of these identical blocks to build the full model.</li></ul>", "answer_zh": "<ul><li>两个主要子层：多头自注意力，然后是前馈网络(FFN)。</li><li>每个子层外面都有<strong>残差连接</strong>和<strong>层归一化</strong>。</li><li>把许多个这样相同的层<strong>堆叠</strong>起来，构成完整模型。</li></ul>", "followup": "<ul><li>追问&quot;FFN 是干嘛的？&quot; → 对每个 token 各自做一次小 MLP，加入非线性、扩大表达能力；attention 负责&quot;token 之间交换信息&quot;，FFN 负责&quot;每个 token 自己加工信息&quot;。</li></ul>", "pitfall": "<ul><li>以为一层里只有 attention；FFN 同样关键，参数量往往比 attention 还大。</li></ul>"}, {"id": "topics/llm/01-transformer.md#q3", "topic": "Transformer 架构总览", "domain": "llm", "file": "topics/llm/01-transformer.md", "status": "drafted", "difficulty": "基础", "q_en": "Why does a Transformer need positional encoding?", "q_zh": "为什么 Transformer 需要位置编码？", "answer_en": "<ul><li>Attention does not care about order — if you shuffle the tokens, the result is the same.</li><li>But word order carries meaning, so we add position information to each token embedding.</li><li>This lets the model know which token comes first and which comes later.</li></ul>", "answer_zh": "<ul><li>attention <strong>不在意顺序</strong>——打乱 token，结果一样。</li><li>但词序有意义，所以要给每个 token 的 embedding <strong>加上位置信息</strong>。</li><li>这样模型才知道 token 的先后。</li></ul>", "followup": "<ul><li>追问&quot;有哪些位置编码方式？&quot; → 固定的正弦编码、可学习的位置 embedding，以及现代常用的旋转位置编码 RoPE（对长度外推更友好）。</li></ul>", "pitfall": "<ul><li>以为位置编码是单独一层；它通常是<strong>加到</strong> token embedding 上的一组向量，不是独立网络。</li></ul>"}, {"id": "topics/llm/01-transformer.md#q4", "topic": "Transformer 架构总览", "domain": "llm", "file": "topics/llm/01-transformer.md", "status": "drafted", "difficulty": "进阶", "q_en": "What's the difference between encoder-only, decoder-only, and encoder-decoder Transformers?", "q_zh": "encoder-only、decoder-only、encoder-decoder 有什么区别？", "answer_en": "<ul><li>Encoder-only reads the whole input both ways; good for understanding tasks. Example: BERT.</li><li>Decoder-only reads left to right and only sees past tokens; good for generation. Example: GPT — most LLMs today are decoder-only.</li><li>Encoder-decoder reads an input and then generates an output; good for translation or summarization. Example: T5.</li></ul>", "answer_zh": "<ul><li><strong>Encoder-only</strong>：双向读整段输入，擅长理解类任务。代表 BERT。</li><li><strong>Decoder-only</strong>：从左到右、只看前文，擅长生成。代表 GPT——<strong>现在大多数 LLM 都是这种</strong>。</li><li><strong>Encoder-decoder</strong>：先读输入再生成输出，擅长翻译、摘要。代表 T5。</li></ul>", "followup": "<ul><li>追问&quot;为什么生成模型用 decoder-only？&quot; → 它用因果掩码(causal mask)保证每个 token 只能看前面的，天然适合&quot;预测下一个 token&quot;的自回归生成。</li></ul>", "pitfall": "<ul><li>以为 GPT 里有 encoder；GPT 是纯 decoder-only。</li></ul>"}, {"id": "topics/llm/01-transformer.md#q5", "topic": "Transformer 架构总览", "domain": "llm", "file": "topics/llm/01-transformer.md", "status": "drafted", "difficulty": "进阶", "q_en": "What do residual connections and layer normalization do?", "q_zh": "残差连接和层归一化有什么作用？", "answer_en": "<ul><li>A residual connection adds the input of a sub-layer back to its output, so gradients flow well and we can train very deep networks.</li><li>Layer normalization keeps the values in each layer in a stable range, which makes training smoother and faster.</li></ul>", "answer_zh": "<ul><li><strong>残差连接</strong>把子层的输入加回到输出上，让梯度顺畅流动，从而能训练很深的网络。</li><li><strong>层归一化</strong>把每层的数值保持在稳定范围，让训练更平滑、更快。</li></ul>", "followup": "<ul><li>追问&quot;LayerNorm 放前面还是后面？&quot; → 有 post-norm（原版，放子层后）和 pre-norm（放子层前）两种；现代大模型多用 <strong>pre-norm</strong>，训练更稳定。</li></ul>", "pitfall": "<ul><li>把 layer normalization 和 batch normalization 搞混；LayerNorm 对<strong>单个样本的特征维</strong>归一化，不依赖 batch 大小，更适合变长序列。</li></ul>"}, {"id": "topics/llm/02-attention.md#q1", "topic": "Attention 机制", "domain": "llm", "file": "topics/llm/02-attention.md", "status": "drafted", "difficulty": "基础", "q_en": "What is self-attention and why does a Transformer need it?", "q_zh": "什么是 self-attention？为什么 Transformer 需要它？", "answer_en": "<ul><li>Self-attention lets each token look at all other tokens in the same sequence and decide which ones matter.</li><li>A Transformer needs it to understand context — for example, what a word like &quot;it&quot; refers to.</li><li>Unlike RNNs, it looks at all tokens at once, so it captures long-range relations and runs in parallel.</li></ul>", "answer_zh": "<ul><li>self-attention 让每个 token 看同一序列里其他所有 token，并决定哪些重要。</li><li>Transformer 靠它理解上下文（比如 &quot;it&quot; 指代谁）。</li><li>和 RNN 不同，它<strong>一次看全部 token</strong>，能抓长距离关系，且可并行。</li></ul>", "followup": "<ul><li>追问&quot;和 RNN 比好在哪？&quot; → RNN 顺序处理、信息要一步步传，远距离容易丢；self-attention 任意两个 token 直接相连，且并行计算更快。</li></ul>", "pitfall": "<ul><li>以为 attention 是一个独立模型；它只是 Transformer 里的一层运算。</li><li>把 self-attention 和 multi-head 混为一谈：multi-head 是&quot;并行做多组 self-attention&quot;。</li></ul>"}, {"id": "topics/llm/02-attention.md#q2", "topic": "Attention 机制", "domain": "llm", "file": "topics/llm/02-attention.md", "status": "drafted", "difficulty": "基础", "q_en": "How does attention work? Explain Q, K, V.", "q_zh": "attention 怎么算的？解释 Q、K、V。", "answer_en": "<ul><li>Each token is turned into three vectors: Query, Key, Value.</li><li>We do a dot product between one token&#x27;s Query and every token&#x27;s Key to get scores.</li><li>We pass the scores through softmax to get weights, then take a weighted sum of the Values.</li></ul>", "answer_zh": "<ul><li>每个 token 变成三个向量：Query、Key、Value。</li><li>用一个 token 的 Query 和所有 token 的 Key 点积，得到分数。</li><li>分数过 softmax 变权重，再对所有 Value 加权求和。</li></ul>", "followup": "<ul><li>追问&quot;Q、K、V 哪来的？&quot; → 由输入向量分别乘三个可学习的权重矩阵 W_Q、W_K、W_V 得到。</li></ul>", "pitfall": "<ul><li>以为 Q、K、V 是固定的；它们是学出来的线性变换结果。</li></ul>"}, {"id": "topics/llm/02-attention.md#q3", "topic": "Attention 机制", "domain": "llm", "file": "topics/llm/02-attention.md", "status": "drafted", "difficulty": "进阶", "q_en": "Why do we divide by √d_k in attention?", "q_zh": "attention 里为什么要除以 √d_k？", "answer_en": "<ul><li>When d_k is large, the dot products get large too.</li><li>Large values make softmax very sharp, so gradients become very small and training gets unstable.</li><li>Dividing by √d_k keeps the scores in a good range. This is called scaled dot-product attention.</li></ul>", "answer_zh": "<ul><li>d_k 大时，点积结果也会变大。</li><li>数值太大会让 softmax 过于尖锐，梯度极小、训练不稳。</li><li>除以 √d_k 把分数拉回合适范围，这就叫 scaled dot-product attention。</li></ul>", "followup": "<ul><li>追问&quot;为什么偏偏是 √d_k？&quot; → 若 Q、K 各维独立、方差为 1，点积方差约为 d_k，除以 √d_k 把方差拉回约 1。</li></ul>", "pitfall": "<ul><li>以为这个缩放是为了归一化概率；归一化是 softmax 干的，缩放是为了数值/梯度稳定。</li></ul>"}, {"id": "topics/llm/02-attention.md#q4", "topic": "Attention 机制", "domain": "llm", "file": "topics/llm/02-attention.md", "status": "drafted", "difficulty": "进阶", "q_en": "What is multi-head attention and why use multiple heads?", "q_zh": "什么是 multi-head attention？为什么用多个头？", "answer_en": "<ul><li>Multi-head attention runs several attention operations in parallel, each with its own Q, K, V.</li><li>Each head can focus on a different kind of relation (e.g. syntax vs. reference).</li><li>We concatenate the heads and project them back, so the model sees the sequence from many angles at once.</li></ul>", "answer_zh": "<ul><li>multi-head 并行跑多组 attention，每组有自己的 Q、K、V。</li><li>每个 head 可以关注不同的关系（如语法 / 指代）。</li><li>把各 head 拼接再投影，让模型同时从多个角度看序列。</li></ul>", "followup": "<ul><li>追问&quot;head 多了维度不会爆吗？&quot; → 通常把总维度切分给各 head（如 512 维分 8 头、每头 64 维），总计算量基本不变。</li></ul>", "pitfall": "<ul><li>以为头越多一定越好；头太多每头维度太小，反而学不到东西，是个权衡。</li></ul>"}, {"id": "topics/llm/02-attention.md#q5", "topic": "Attention 机制", "domain": "llm", "file": "topics/llm/02-attention.md", "status": "drafted", "difficulty": "进阶", "q_en": "What is the computational cost of self-attention, and why does it matter for long context?", "q_zh": "self-attention 的计算复杂度是多少？为什么对长上下文是个问题？", "answer_en": "<ul><li>Self-attention is O(n²) in sequence length, because every token attends to every other token.</li><li>For long inputs, both compute and memory grow fast, which makes long context expensive.</li><li>This is why techniques like KV cache, FlashAttention, and sparse attention exist.</li></ul>", "answer_zh": "<ul><li>self-attention 对序列长度是 <strong>O(n²)</strong>，因为每个 token 都要看其他所有 token。</li><li>输入越长，计算和显存涨得越快，所以长上下文很贵。</li><li>这正是 KV cache、FlashAttention、稀疏 attention 等技术存在的原因。</li></ul>", "followup": "<ul><li>追问&quot;KV cache 解决的是哪部分？&quot; → 生成时缓存已算过的 K、V，避免每生成一个新 token 都重算前面所有 token，省的是<strong>推理</strong>时的重复计算。</li></ul>", "pitfall": "<ul><li>把 O(n²) 说成是参数量；它说的是<strong>计算/显存随序列长度</strong>的增长，不是模型大小。</li></ul>"}];
const $ = s => document.querySelector(s);
const CARDMAP = Object.fromEntries(CARDS.map(c => [c.id, c]));
const SKEY = 'aie-srs-v1';
const DAY = 86400000;
let srs = JSON.parse(localStorage.getItem(SKEY) || '{}');
let lang = 'both', mode = 'study', studyAll = false;
let session = [], revealed = false;

function saveSrs(){ localStorage.setItem(SKEY, JSON.stringify(srs)); }
function st(id){ return srs[id] || (srs[id] = {ease:2.5, ivl:0, due:0, reps:0}); }

function fillSelect(sel, vals){
  for(const v of [...new Set(vals)].filter(Boolean).sort())
    sel.insertAdjacentHTML('beforeend', `<option>${v}</option>`);
}
fillSelect($('#fDomain'), CARDS.map(c=>c.domain));
fillSelect($('#fDiff'), CARDS.map(c=>c.difficulty));
function refreshTopics(){
  const d = $('#fDomain').value, s = $('#fTopic');
  s.innerHTML = '<option value="">全部主题</option>';
  fillSelect(s, CARDS.filter(c=>!d||c.domain===d).map(c=>c.topic));
}
refreshTopics();

function filtered(){
  const d=$('#fDomain').value, t=$('#fTopic').value, f=$('#fDiff').value;
  return CARDS.filter(c=>(!d||c.domain===d)&&(!t||c.topic===t)&&(!f||c.difficulty===f));
}
function buildSession(){
  const now = Date.now();
  let pool = filtered();
  if(!studyAll) pool = pool.filter(c => st(c.id).due <= now);
  session = pool.map(c => c.id);
  revealed = false;
}

function nextIvl(s, g){
  if(g==='hard') return s.ivl ? Math.max(1, Math.round(s.ivl*1.2)) : 1;
  if(g==='good') return s.ivl ? Math.round(s.ivl*s.ease) : 1;
  return s.ivl ? Math.round(s.ivl*s.ease*1.3) : 3;          // easy
}
function ivlLabel(s, g){ return g==='again' ? '<10分' : nextIvl(s,g)+'天'; }

function grade(g){
  const id = session[0], s = st(id);
  s.reps++;
  if(g==='again'){ s.ease=Math.max(1.3,s.ease-0.2); s.ivl=0; s.due=Date.now(); }
  else { if(g==='hard') s.ease=Math.max(1.3,s.ease-0.15); if(g==='easy') s.ease+=0.15;
         s.ivl=nextIvl(s,g); s.due=Date.now()+s.ivl*DAY; }
  saveSrs();
  session.shift();
  if(g==='again') session.splice(Math.min(session.length,3),0,id);   // 稍后再出现
  revealed=false;
  renderStudy();
}

function answerHtml(c){
  return (c.answer_en?`<h4 class="ans-en">Answer (EN)</h4><div class="ans-en">${c.answer_en}</div>`:'')
    + (c.answer_zh?`<h4 class="ans-zh">核心答案</h4><div class="ans-zh">${c.answer_zh}</div>`:'')
    + (c.followup?`<h4>追问 / 深入</h4>${c.followup}`:'')
    + (c.pitfall?`<h4>常见误区</h4>${c.pitfall}`:'');
}

function renderStudy(){
  const wrap = $('#study'); wrap.className = 'lang-'+lang;
  updateStats();
  if(!session.length){
    const any = filtered().length;
    wrap.innerHTML = `<div class="done"><div class="big">🎉 ${studyAll?'全部过完了':'这组今天复习完了'}</div>`
      + (any?`<button id="againAll">${studyAll?'再过一遍':'无视进度 · 全部再学一遍'}</button>`:'<p>没有卡片，换个筛选试试。</p>')
      + `</div>`;
    const b=$('#againAll'); if(b) b.onclick=()=>{ studyAll=true; buildSession(); renderStudy(); };
    return;
  }
  const c = CARDMAP[session[0]], s = st(c.id);
  wrap.innerHTML = `<div class="scard">
    <div class="badges"><span class="badge">${c.domain}</span><span class="badge">${c.topic}</span><span class="badge">${c.difficulty}</span></div>
    <div class="q"><span class="en">${c.q_en||''}</span><span class="zh">${c.q_zh||''}</span></div>
    <div class="ans ${revealed?'':'hidden'}">${answerHtml(c)}</div>
    <div class="actions">${revealed
      ? `<div class="grades">
          <button class="g-again" data-g="again">重来<small>${ivlLabel(s,'again')}</small></button>
          <button class="g-hard" data-g="hard">难<small>${ivlLabel(s,'hard')}</small></button>
          <button class="g-good" data-g="good">良<small>${ivlLabel(s,'good')}</small></button>
          <button class="g-easy" data-g="easy">简单<small>${ivlLabel(s,'easy')}</small></button></div>`
      : `<button class="reveal" id="reveal">显示答案<small>空格</small></button>`}</div>
  </div>`;
  if(!revealed) $('#reveal').onclick=()=>{ revealed=true; renderStudy(); };
  else wrap.querySelectorAll('[data-g]').forEach(b=> b.onclick=()=>grade(b.dataset.g));
}

function renderBrowse(){
  const wrap=$('#browse'); wrap.className='lang-'+lang;
  const list=filtered();
  wrap.innerHTML = list.length ? list.map(c=>`<div class="card">
    <div class="badges"><span class="badge">${c.domain}</span><span class="badge">${c.topic}</span><span class="badge">${c.difficulty}</span></div>
    <div class="q"><span class="en">${c.q_en||''}</span><span class="zh">${c.q_zh||''}</span></div>
    <details><summary>显示答案</summary><div class="ans">${answerHtml(c)}</div></details>
  </div>`).join('') : '<div class="empty">没有匹配的卡片</div>';
}

function updateStats(){
  const now=Date.now(), fil=filtered();
  const due=fil.filter(c=>st(c.id).due<=now).length;
  const learned=fil.filter(c=>st(c.id).reps>0).length;
  $('#stats').innerHTML = mode==='study'
    ? `待学 <b>${session.length}</b> · 到期 <b>${due}</b> · 共 <b>${fil.length}</b>`
    : `共 <b>${fil.length}</b> 卡 · 学过 <b>${learned}</b>`;
}

function rerender(){ mode==='study' ? renderStudy() : renderBrowse(); }
function refilter(){ if(mode==='study'){ studyAll=false; buildSession(); } rerender(); }

$('#fDomain').onchange=()=>{ refreshTopics(); refilter(); };
$('#fTopic').onchange=refilter;
$('#fDiff').onchange=refilter;
$('#lang').onclick=e=>{ if(e.target.dataset.l){ lang=e.target.dataset.l;
  [...e.target.parentNode.children].forEach(b=>b.classList.toggle('on',b===e.target)); rerender(); } };
$('#mode').onclick=e=>{ if(e.target.dataset.m){ mode=e.target.dataset.m;
  [...e.target.parentNode.children].forEach(b=>b.classList.toggle('on',b===e.target));
  $('#study').classList.toggle('hidden',mode!=='study');
  $('#browse').classList.toggle('hidden',mode!=='browse');
  if(mode==='study'){ studyAll=false; buildSession(); } rerender(); } };
$('#reset').onclick=()=>{ if(confirm('清空所有学习进度？')){ srs={}; saveSrs(); studyAll=false; buildSession(); rerender(); } };

document.addEventListener('keydown', e=>{
  if(mode!=='study' || !session.length) return;
  if((e.key===' '||e.key==='Enter') && !revealed){ e.preventDefault(); revealed=true; renderStudy(); }
  else if(revealed && ['1','2','3','4'].includes(e.key)){
    grade({'1':'again','2':'hard','3':'good','4':'easy'}[e.key]); }
});

buildSession(); rerender();
</script>
</body>
</html>
